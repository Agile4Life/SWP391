server:
  port: 8080

spring:
  profiles:
    default: postgresql,local
    group:
      supabase: postgresql
  application:
    name: scms-api
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl.halt_on_error: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    filter: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:c2Ntc19sb2NhbF9qd3Rfc2VjcmV0X2tleV9mb3Jfc3dwMzkxX3Byb2plY3RfMjAyNg==}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    web-origin: ${APP_WEB_ORIGIN:http://localhost:5173}
  auth:
    debug-otp-enabled: false
    otp:
      delivery: ${APP_OTP_DELIVERY:disabled}
      from-address: ${SMTP_FROM:no-reply@example.invalid}
