server:
  port: 8080
  servlet:
    session:
      timeout: 5m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

spring:
  profiles:
    default: supabase
  application:
    name: scms-api
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl.halt_on_error: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    filter: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
  qr:
    secret: ${APP_QR_SECRET:${APP_JWT_SECRET}}
    ttl-seconds: ${APP_QR_TTL_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    web-origin: ${APP_WEB_ORIGIN:http://localhost:5173}
  auth:
    debug-otp-enabled: ${APP_AUTH_DEBUG_OTP_ENABLED:false}
    otp:
      delivery: ${APP_OTP_DELIVERY:disabled}
      from-address: ${SMTP_FROM:no-reply@example.invalid}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
