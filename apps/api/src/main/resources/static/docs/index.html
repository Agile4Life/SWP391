<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SCMS API Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/swagger-ui/swagger-ui.css">
  <style>
    /* Same brand values as apps/web theme.css (--sol-accent*): Dark = charcoal + silver, Light = salmon. */
    :root {
      --bg: #202020; --surface: #292929; --line: #ffffff26; --text: #faf9f6; --muted: #b4b4b4;
      --accent: #c8cdd6; --accent-hover: #e6e9ef; --on-accent: #202020; --danger: #ff8a80;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f4f1; --surface: #ffffff; --line: #e4e2de; --text: #202020; --muted: #6b6b6b;
        --accent: #ce9180; --accent-hover: #e1aa98; --on-accent: #ffffff; --danger: #c0392b;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    [hidden] { display: none !important; }

    /* ---------- login ---------- */
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .02em; }
    .brand b { display: block; font-size: 15px; }
    .brand span { font-size: 12px; color: var(--muted); }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { margin: 0 0 24px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
    label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    input { width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 14px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .pw { position: relative; }
    .pw input { padding-right: 64px; }
    .pw button { position: absolute; right: 6px; top: 6px; height: 32px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; border-radius: 8px; }
    .pw button:hover { color: var(--text); }
    .btn { width: 100%; height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn:focus-visible, .pw button:focus-visible, .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .error { min-height: 20px; margin: 0 0 12px; font-size: 13px; color: var(--danger); }
    .foot { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }

    /* ---------- docs ---------- */
    .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .bar .brand { margin: 0; }
    .bar .logo { width: 34px; height: 34px; font-size: 13px; }
    .spacer { flex: 1; }
    .who { font-size: 13px; color: var(--muted); }
    .who b { color: var(--text); }
    .ghost { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .ghost:hover { border-color: var(--accent); }
    .sheet { max-width: 1280px; margin: 24px auto; padding: 0 16px 48px; }
    #swagger { background: #fff; border-radius: 14px; padding: 8px 0 24px; color: #3b4151; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui, .swagger-ui .info .title { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    .loading { text-align: center; color: var(--muted); padding: 80px 0; font-size: 14px; }
    @media (max-width: 600px) { .card { padding: 28px 20px; } .who { display: none; } .bar { padding: 10px 16px; } }
    @media (prefers-reduced-motion: no-preference) { .card { animation: rise .35s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(8px); } } }
  </style>
</head>
<body>
  <main class="gate" id="gate" hidden>
    <form class="card" id="form" novalidate>
      <div class="brand"><div class="logo">SC</div><div><b>SCMS</b><span>Sports Center Management System</span></div></div>
      <h1>Tài liệu API</h1>
      <p class="sub">Khu vực dành cho quản trị viên. Đăng nhập bằng tài khoản ADMIN để xem và thử các endpoint.</p>
      <p class="error" id="error" role="alert"></p>
      <div class="field"><label for="u">Tên đăng nhập hoặc email</label><input id="u" name="username" autocomplete="username" autofocus required></div>
      <div class="field"><label for="p">Mật khẩu</label>
        <div class="pw"><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" id="toggle" aria-label="Hiện mật khẩu">Hiện</button></div>
      </div>
      <button class="btn" id="submit" type="submit">Đăng nhập</button>
      <p class="foot">SWP391 · Nhóm 1 · OpenAPI 3</p>
    </form>
  </main>

  <div id="docs" hidden>
    <header class="bar">
      <div class="brand"><div class="logo">SC</div><div><b>SCMS API</b><span>OpenAPI 3 · REST</span></div></div>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <button class="ghost" id="logout" type="button">Đăng xuất</button>
    </header>
    <div class="sheet"><div id="swagger"><p class="loading">Đang tải đặc tả API…</p></div></div>
  </div>

  <script src="/swagger-ui/swagger-ui-bundle.js"></script>
  <script>
    const KEY = 'scms_docs_session';
    const $ = (id) => document.getElementById(id);
    const read = () => { try { return JSON.parse(sessionStorage.getItem(KEY)); } catch { return null; } };
    const save = (v) => { try { v ? sessionStorage.setItem(KEY, JSON.stringify(v)) : sessionStorage.removeItem(KEY); } catch { /* private mode: login lasts one page view */ } };

    function showGate(message) {
      $('docs').hidden = true; $('gate').hidden = false;
      $('error').textContent = message || '';
      $('p').value = ''; $('u').focus();
    }

    async function showDocs(session) {
      $('gate').hidden = true; $('docs').hidden = false;
      $('who').innerHTML = '';
      const b = document.createElement('b'); b.textContent = session.name || session.username;
      $('who').append('Đăng nhập: ', b, ' · ', session.role);
      const auth = { Authorization: 'Bearer ' + session.token };
      const res = await fetch('/v3/api-docs', { headers: auth });
      if (res.status === 401 || res.status === 403) { save(null); return showGate('Phiên đã hết hạn hoặc không đủ quyền. Vui lòng đăng nhập lại.'); }
      if (!res.ok) { $('swagger').innerHTML = '<p class="loading">Không tải được đặc tả API (HTTP ' + res.status + ').</p>'; return; }
      SwaggerUIBundle({
        spec: await res.json(), dom_id: '#swagger', deepLinking: true, filter: true,
        displayRequestDuration: true, tryItOutEnabled: true, docExpansion: 'none',
        requestInterceptor: (req) => { if (!req.headers.Authorization) req.headers.Authorization = auth.Authorization; return req; },
      });
    }

    $('toggle').onclick = () => {
      const show = $('p').type === 'password';
      $('p').type = show ? 'text' : 'password';
      $('toggle').textContent = show ? 'Ẩn' : 'Hiện';
      $('toggle').setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    };
    $('logout').onclick = () => { save(null); location.reload(); };

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const username = $('u').value.trim(), password = $('p').value;
      if (!username || !password) { $('error').textContent = 'Vui lòng nhập đủ tên đăng nhập và mật khẩu.'; return; }
      $('submit').disabled = true; $('submit').textContent = 'Đang đăng nhập…'; $('error').textContent = '';
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept-Language': 'vi' },
          body: JSON.stringify({ username, password }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.data) { $('error').textContent = body.message || 'Đăng nhập thất bại.'; return; }
        const d = body.data;
        if (String(d.role).toUpperCase() !== 'ADMIN') { $('error').textContent = 'Tài khoản này không có quyền xem tài liệu API (cần ADMIN).'; return; }
        const session = { token: d.token, username: d.username, name: d.fullName, role: String(d.role).toUpperCase() };
        save(session); showDocs(session);
      } catch { $('error').textContent = 'Không kết nối được máy chủ. Thử lại sau.'; }
      finally { $('submit').disabled = false; $('submit').textContent = 'Đăng nhập'; }
    };

    const existing = read();
    existing ? showDocs(existing) : showGate();
  </script>
</body>
</html>
