spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      data-source-properties:
        sslmode: ${DB_SSL_MODE:require}
        sslrootcert: ${DB_SSL_ROOT_CERT:}
        # Safe if a transaction pooler is selected; session pooler is preferred.
        prepareThreshold: 0
  jpa:
    properties:
      hibernate:
        jdbc.time_zone: Asia/Ho_Chi_Minh
app:
  jwt:
    secret: ${APP_JWT_SECRET}
  auth:
    debug-otp-enabled: false
  bootstrap:
    manager:
      email: ${APP_BOOTSTRAP_MANAGER_EMAIL:}
      password: ${APP_BOOTSTRAP_MANAGER_PASSWORD:}
