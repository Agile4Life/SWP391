# Giữ nguyên giao thức HTTPS khi proxy TLS phía trước truyền header X-Forwarded-Proto.
map $http_x_forwarded_proto $scms_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 35m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # DNS nội bộ của Docker cập nhật theo IP mới của API sau khi container được tạo lại.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_backend api:8080;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scms_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    # Chuyển tiếp Swagger UI và OpenAPI JSON; nếu thiếu khối này, fallback SPA sẽ trả về index.html.
    location ~ ^/(swagger-ui|v3/api-docs) {
        set $api_backend api:8080;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scms_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # Các route của React Router phải hoạt động khi mở trực tiếp hoặc tải lại trang.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
