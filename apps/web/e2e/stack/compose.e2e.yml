# Stack cô lập cho e2e: PostgreSQL tạm + API (profile supabase, ghi đè bằng biến môi trường).
# Không dùng .env của dự án và không chạm Supabase. Dữ liệu nằm trong volume tmpfs, mất khi `down`.
name: scms-e2e

services:
  db:
    image: postgres:16
    # TLS tự ký: API (profile supabase) bắt buộc sslmode=require, nên DB e2e cũng bật TLS.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /certs &&
        openssl req -new -x509 -days 30 -nodes -subj /CN=db -out /certs/server.crt -keyout /certs/server.key &&
        chown postgres:postgres /certs/server.crt /certs/server.key && chmod 600 /certs/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
    environment:
      POSTGRES_DB: scms_e2e
      POSTGRES_USER: scms
      POSTGRES_PASSWORD: scms_e2e_only
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scms -d scms_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../../../api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/scms_e2e
      SPRING_DATASOURCE_USERNAME: scms
      SPRING_DATASOURCE_PASSWORD: scms_e2e_only
      DB_SSL_MODE: require
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: e2e-only-jwt-secret-e2e-only-jwt-secret-0123456789
      APP_BOOTSTRAP_ADMIN_EMAIL: admin@e2e.sol.vn
      APP_BOOTSTRAP_ADMIN_PASSWORD: Admin@12345
      APP_DEMO_SEED_ENABLED: "true"
      APP_DEMO_PASSWORD: Demo@12345
      APP_AUTH_DEBUG_OTP_ENABLED: "true"
      APP_OTP_DELIVERY: disabled
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173
      APP_WEB_ORIGIN: http://localhost:4173
      VNPAY_ENABLED: "false"
      PORT: "8080"
    ports:
      - "8080:8080"
