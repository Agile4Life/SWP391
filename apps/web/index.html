<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SÖL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('scms_theme') === 'dark' ? 'dark' : 'light'; }
      catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <title>SÖL WELLNESS SANCTUARY | Luxury Sports &amp; Health Club - SCMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; }
      .boot-loading { box-sizing: border-box; min-height: 100dvh; padding: 88px clamp(20px, 5vw, 80px) 40px; background: #f5f5f3; }
      .boot-loading__label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .boot-loading__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .boot-loading__card { display: grid; align-content: start; gap: 16px; padding: 20px; border: 1px solid #e4e2de; border-radius: 12px; background: #fff; }
      .boot-loading__card span { display: block; height: 12px; border-radius: 5px; background: #eeefec; }
      .boot-loading__card span:first-child { height: clamp(160px, 24vw, 300px); border-radius: 8px; }
      .boot-loading__card span:last-child { width: 70%; }
      :root[data-theme='dark'] .boot-loading { background: #202020; }
      :root[data-theme='dark'] .boot-loading__card { background: #292929; border-color: #ffffff14; }
      :root[data-theme='dark'] .boot-loading__card span { background: #303030; }
      @media (max-width: 767px) { .boot-loading__grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-loading" role="status" aria-live="polite" aria-busy="true">
        <span class="boot-loading__label">Đang tải trang…</span>
        <div class="boot-loading__grid" aria-hidden="true">
          <div class="boot-loading__card"><span></span><span></span><span></span></div>
          <div class="boot-loading__card"><span></span><span></span><span></span></div>
          <div class="boot-loading__card"><span></span><span></span><span></span></div>
        </div>
      </main>
    </div>
    <!-- Google Identity Services for Google Sign-In (SCRUM-89) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
