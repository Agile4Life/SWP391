openapi: 3.0.3
info:
  title: SCMS admin payment reconciliation (read only)
  version: 1.0.0
  description: >-
    Read-only VNPay reconciliation for administrators: attempts, recorded callbacks (IPN and verified returns),
    automatic wallet refunds for late VNPay confirmations, and the full timeline of one payment. No endpoint changes
    money or payment state. All endpoints require role ADMIN (403 otherwise), use the ApiResponse envelope and
    Accept-Language localization. Dates are ISO local dates in Asia/Ho_Chi_Minh; `to` is inclusive. When both are
    omitted the range is the last 7 days; a range longer than 92 days returns 400.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /admin/payments/reconciliation/summary:
    get:
      summary: Overview counters
      description: >-
        staleAttempts, pendingAttempts and anomalies describe the current state and ignore the range. A stale attempt
        is pending and past expires_at + 15 minutes; its presence means the expiry job is not running.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: ApiResponse containing ReconciliationSummary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ReconciliationSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/payments/reconciliation/attempts:
    get:
      summary: VNPay attempts, newest first
      description: With stale=true only stale attempts are returned regardless of status and range. q matches the exact reference or part of the member email or phone.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, success, failed]}}
        - {name: stale, in: query, schema: {type: boolean}}
        - {name: q, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: ApiResponse containing a Spring page of VnpayAttemptRow
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              content: {type: array, items: {$ref: '#/components/schemas/VnpayAttemptRow'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/payments/reconciliation/late-refunds:
    get:
      summary: Automatic wallet refunds for VNPay money confirmed too late
      description: Wallet credits with reference_type VNPAY_LATE_REFUND or reference_id ORDER_LATE_REFUND_<ref>, newest first.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: ApiResponse containing a Spring page of LateRefundRow
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              content: {type: array, items: {$ref: '#/components/schemas/LateRefundRow'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/payments/reconciliation/ipn-events:
    get:
      summary: Recorded VNPay callbacks, newest first
      parameters:
        - {name: rspCode, in: query, schema: {type: string, pattern: '^[0-9]{2}$'}, description: 'Code returned to VNPay: 00, 01, 02, 04, 97, 99'}
        - {name: source, in: query, schema: {type: string, enum: [IPN, RETURN]}}
        - {name: reference, in: query, schema: {type: string, maxLength: 32}}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: ApiResponse containing a Spring page of IpnEventRow
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              content: {type: array, items: {$ref: '#/components/schemas/IpnEventRow'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/payments/reconciliation/payments/{paymentId}/timeline:
    get:
      summary: Full history of one payment
      description: Payment, every VNPay attempt, every callback for those references, related wallet transactions (WALLET_PAY_<id>, <ref>:TOPUP, <ref>:DEBIT, <ref>:LATE_REFUND, ORDER_LATE_REFUND_<ref>) and the invoice, merged in time order.
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: ApiResponse containing PaymentTimeline
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/PaymentTimeline'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'PAYMENT_NOT_FOUND', content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    From: {name: from, in: query, schema: {type: string, format: date}}
    To: {name: to, in: query, schema: {type: string, format: date}, description: Inclusive}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  responses:
    BadRequest:
      description: RECONCILIATION_RANGE_INVALID, RECONCILIATION_RANGE_TOO_LONG, RECONCILIATION_PAGE_INVALID or RECONCILIATION_FILTER_INVALID
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}
    Forbidden:
      description: Caller is not ADMIN
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}
  schemas:
    ApiResponse:
      type: object
      properties:
        success: {type: boolean}
        status: {type: integer}
        message: {type: string}
        code: {type: string}
        timestamp: {type: string, format: date-time}
    PageMeta:
      type: object
      properties:
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        number: {type: integer}
        size: {type: integer}
    MemberRef:
      type: object
      nullable: true
      properties:
        userId: {type: integer, format: int64}
        fullName: {type: string}
        email: {type: string}
        phone: {type: string, nullable: true}
    ReconciliationSummary:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        staleAttempts: {type: integer, format: int64}
        pendingAttempts: {type: integer, format: int64}
        lateRefundCount: {type: integer, format: int64}
        lateRefundAmount: {type: number}
        ipnRetryable: {type: integer, format: int64, description: Callbacks answered 99}
        ipnRejected: {type: integer, format: int64, description: 'Callbacks answered 97, 04 or 01'}
        multiAttemptPayments: {type: integer, format: int64}
        anomalies:
          type: object
          properties:
            successAttemptUnpaid: {type: integer, format: int64, description: Successful attempt on a payment that is neither success nor refunded}
            walletPaymentWithoutSource: {type: integer, format: int64, description: Self-service online_wallet payment marked success without a successful attempt or WALLET_PAY_<id> debit}
            total: {type: integer, format: int64}
    VnpayAttemptRow:
      type: object
      properties:
        reference: {type: string}
        paymentId: {type: integer, format: int64}
        member: {$ref: '#/components/schemas/MemberRef'}
        amount: {type: number}
        status: {type: string, enum: [pending, success, failed]}
        stale: {type: boolean}
        paymentStatus: {type: string, enum: [pending, success, failed, refunded]}
        targetType: {type: string, enum: [MEMBERSHIP, COACH_BOOKING, COURT_BOOKING, PRODUCT_ORDER, COURSE, WALLET_TOPUP]}
        targetId: {type: integer, format: int64, nullable: true}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        gatewayTransactionNo: {type: string, nullable: true}
        attemptCount: {type: integer, format: int64}
    LateRefundRow:
      type: object
      properties:
        walletTransactionId: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        member: {$ref: '#/components/schemas/MemberRef'}
        amount: {type: number}
        kind: {type: string, enum: [VNPAY_LATE_REFUND, ORDER_LATE_REFUND]}
        reference: {type: string, nullable: true}
        paymentId: {type: integer, format: int64, nullable: true}
        paymentStatus: {type: string, nullable: true}
    IpnEventRow:
      type: object
      properties:
        id: {type: integer, format: int64}
        reference: {type: string, nullable: true}
        source: {type: string, enum: [IPN, RETURN]}
        gatewayResponseCode: {type: string, nullable: true}
        gatewayTransactionStatus: {type: string, nullable: true}
        gatewayTransactionNo: {type: string, nullable: true}
        amount: {type: number, nullable: true}
        rspCode: {type: string}
        receivedAt: {type: string, format: date-time}
    PaymentTimeline:
      type: object
      properties:
        payment:
          type: object
          properties:
            id: {type: integer, format: int64}
            member: {$ref: '#/components/schemas/MemberRef'}
            amount: {type: number}
            refundedAmount: {type: number, nullable: true}
            method: {type: string}
            status: {type: string}
            targetType: {type: string}
            targetId: {type: integer, format: int64, nullable: true}
            createdAt: {type: string, format: date-time}
            paidAt: {type: string, format: date-time, nullable: true}
            invoiceNumber: {type: string, nullable: true}
        attempts: {type: array, items: {$ref: '#/components/schemas/VnpayAttemptRow'}}
        callbacks: {type: array, items: {$ref: '#/components/schemas/IpnEventRow'}}
        walletTransactions:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, format: int64}
              type: {type: string}
              referenceType: {type: string, nullable: true}
              referenceId: {type: string, nullable: true}
              amount: {type: number}
              createdAt: {type: string, format: date-time}
        entries:
          type: array
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              type: {type: string, enum: [PAYMENT_CREATED, ATTEMPT_CREATED, CALLBACK_RECEIVED, WALLET_TRANSACTION, PAYMENT_PAID, INVOICE_ISSUED]}
              reference: {type: string, nullable: true}
              status: {type: string, nullable: true}
              code: {type: string, nullable: true}
              source: {type: string, nullable: true}
              amount: {type: number, nullable: true}
              detail: {type: string, nullable: true}
