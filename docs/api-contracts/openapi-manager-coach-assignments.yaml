openapi: 3.0.3
info:
  title: Manager coach assignments (PR97 corrections)
  version: 1.1.0
  description: |
    Center manager screen, UI owner Khoa; related backlog SCRUM-121 and SCRUM-124.
    All operations require CENTER_MANAGER (legacy MANAGER alias accepted).
    Accept-Language selects vi (default) or en for messages and assignment labels.
    The screen is read-only: there is no transfer or end-assignment API. Whoever takes on a member
    (training plan, 1:1 PT or class coach) keeps that member until the relationship ends naturally. No request changes unrelated assignments.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /manager/coach-assignments:
    get:
      summary: Current coach/member relationships and independent active coach choices
      description: |
        Plans are active with startDate <= center today <= endDate. PT sessions are confirmed
        and start strictly after the current center time. Classes are active and have a future
        scheduled session; both booked ClassEnrollment and booked SessionBooking members count.
        Member accounts must be active and non-deleted. Active coaches are always listed; coaches on
        leave, terminated or with an inactive account are listed (employmentStatus shows why) only while
        they still hold current relationships, so the manager can see who they still hold. With a type filter and no
        coachId, coaches without matching rows are omitted.
        A class/member pair appears once even with both enrollment sources. All upcoming PT sessions
        of one member with one coach collapse into a single PT_1_1 row (next session, last date and
        sessionCount). Class rows built from a whole-course enrollment carry the class's
        next/last upcoming session and remaining session count. Student counters
        count distinct member IDs, including per-type counters. Filters apply to displayed
        relationships and student counters. availableCoaches is always the full independent
        active coach list; coach counters describe that list and remain unaffected by filters.
      parameters:
        - name: coachId
          in: query
          schema: { type: integer, format: int64 }
        - name: search
          in: query
          description: |
            Case-insensitive member name/code/phone/email, coach name or relationship detail.
            Matching coach names take priority and show only those coaches, even without assignments.
            Otherwise only coaches with matching member relationships are returned.
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [ALL, TRAINING_PLAN, PT_1_1, CLASS], default: ALL }
        - name: sortBy
          in: query
          description: |
            Coach sort field (case-insensitive). Omitted together with sortDir keeps the server order.
            Ties fall back to coach name, then coachId.
          schema: { type: string, enum: [name, totalStudentsCount, ptStudentsCount, planStudentsCount, classStudentsCount, specialization, employmentStatus] }
        - name: sortDir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Current assignments; an empty coaches or students list is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Overview' }
        '400': { description: Invalid assignment type, sort field (INVALID_SORT_FIELD) or sort direction (INVALID_SORT_DIRECTION), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required }
        '403': { description: Manager role required }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
    Error:
      type: object
      description: Shared global error envelope with localized message and code
      properties:
        code: { type: string }
        message: { type: string }
    Student:
      type: object
      properties:
        memberId: { type: integer, format: int64 }
        membershipCode: { type: string, nullable: true }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        fitnessGoal: { type: string, nullable: true }
        fitnessLevel: { type: string, nullable: true }
        healthNotes: { type: string, nullable: true }
        assignmentType: { type: string, enum: [TRAINING_PLAN, PT_1_1, CLASS] }
        assignmentTypeLabel: { type: string }
        detail: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        nextSession: { type: string, nullable: true }
        status: { type: string }
        referenceId: { type: integer, format: int64, description: Plan ID, next upcoming PT booking ID or read-only class ID, according to assignmentType }
        membershipIssue: { type: string, nullable: true, enum: [FROZEN, NO_ACTIVE, NOT_COVERED] }
        sessionCount: { type: integer, nullable: true, description: Upcoming PT sessions grouped into a PT_1_1 row, or remaining sessions of a whole-course class enrollment; null otherwise }
    Overview:
      type: object
      properties:
        availableCoaches:
          type: array
          items:
            type: object
            properties:
              coachId: { type: integer, format: int64 }
              coachName: { type: string }
              specialization: { type: string, nullable: true }
        stats:
          type: object
          properties:
            totalCoaches: { type: integer }
            activeCoaches: { type: integer }
            totalAssignedStudents: { type: integer }
            totalPtStudents: { type: integer }
            totalPlanStudents: { type: integer }
            totalClassStudents: { type: integer }
        coaches:
          type: array
          items:
            type: object
            properties:
              coachId: { type: integer, format: int64 }
              coachName: { type: string }
              coachEmail: { type: string, nullable: true }
              coachPhone: { type: string, nullable: true }
              specialization: { type: string, nullable: true }
              bio: { type: string, nullable: true }
              employmentStatus: { type: string }
              totalStudentsCount: { type: integer }
              ptStudentsCount: { type: integer }
              planStudentsCount: { type: integer }
              classStudentsCount: { type: integer }
              students: { type: array, items: { $ref: '#/components/schemas/Student' } }
