openapi: 3.0.3
info:
  title: SCMS API - Sprint 3 Operations Contract (Attendance & Session Lifecycle)
  version: 1.0.0
  description: >
    API contracts for Sprint 3 Operations subsystem:
    - SCRUM-111: Session Attendance Roster and Batch Attendance API
    - SCRUM-112: Smart Waitlist Automatic 24h Expiry & Promotion Background Scheduler (removed; there is no waitlist)
    - SCRUM-113: Class Session Cancellation with Reason & In-App Notification
    All endpoints require Bearer JWT authentication and enforce strict RBAC via @PreAuthorize.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: integer
        message:
          type: string
        code:
          type: string
        data:
          description: Payload
        timestamp:
          type: string
          format: date-time

    BatchAttendanceRequest:
      type: object
      required: [records]
      properties:
        publishEvaluations:
          type: boolean
          default: false
          description: Send each evaluated member a notification after successful evaluation save.
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceItem'

    AttendanceItem:
      type: object
      required: [memberId, status]
      properties:
        memberId:
          type: integer
          format: int64
        status:
          type: string
          enum: [present, absent, late, excused]
        notes:
          type: string
          maxLength: 255
        progressScore:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true

    SessionAttendanceResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        classId:
          type: integer
          format: int64
        className:
          type: string
        sessionDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        coachId:
          type: integer
          format: int64
        coachName:
          type: string
        roomName:
          type: string
        totalBooked:
          type: integer
        totalPresent:
          type: integer
        totalAbsent:
          type: integer
        totalLate:
          type: integer
        totalExcused:
          type: integer
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberAttendanceItem'

    CoachSessionHistoryItem:
      type: object
      properties:
        sessionId: { type: integer, format: int64 }
        classId: { type: integer, format: int64, nullable: true }
        className: { type: string }
        roomName: { type: string, nullable: true }
        sessionDate: { type: string, format: date }
        startTime: { type: string, example: '17:30:00' }
        endTime: { type: string, example: '18:30:00' }
        presentCount: { type: integer }
        lateCount: { type: integer }
        absentCount: { type: integer }
        excusedCount: { type: integer }
        evaluatedCount: { type: integer }
        averageScore: { type: number, nullable: true }
        lastEvaluatedAt: { type: string, format: date-time, nullable: true }
        attendanceEditable:
          type: boolean
          description: False once the session is more than 7 days old; statuses can no longer change.

    MemberAttendanceItem:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
        membershipCode:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        enrollmentStatus:
          type: string
        attendanceStatus:
          type: string
          enum: [present, absent, late, excused]
          nullable: true
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        recordedByCoachId:
          type: integer
          format: int64
          nullable: true
        recordedByCoachName:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        gateCheckinAt:
          type: string
          format: date-time
          nullable: true
          description: Giờ quét cổng (GRANTED) phủ buổi học, bắt đầu tối đa 3 giờ trước giờ học và còn ở trong trung tâm lúc buổi bắt đầu. Chỉ để HLV tham khảo, không tự ghi điểm danh.

    CancelSessionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 255
          example: "Coach attending medical emergency"

    ClassSessionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        classId:
          type: integer
          format: int64
        className:
          type: string
        disciplineId:
          type: integer
          format: int64
        disciplineName:
          type: string
        coachId:
          type: integer
          format: int64
        coachName:
          type: string
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
        sessionDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        cancelReason:
          type: string
          nullable: true
        capacity:
          type: integer
        bookedCount:
          type: integer

security:
  - bearerAuth: []

paths:
  /attendance/sessions/{id}:
    get:
      summary: Get enrolled roster and attendance status for a class session (SCRUM-111)
      tags: [Attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Session roster and attendance status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SessionAttendanceResponse'

  /attendance/sessions/{id}/batch:
    post:
      summary: Batch record attendance for session members (SCRUM-111)
      tags: [Attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAttendanceRequest'
      responses:
        '200':
          description: Batch attendance successfully recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemberAttendanceItem'
        '400':
          description: >-
            ATTENDANCE_EDIT_WINDOW_CLOSED when a status would change more than 7 days after the session
            (evaluations with unchanged statuses are still accepted); also not started / not enrolled.
        '409':
          description: Duplicate attendance record constraint violation

  /attendance/sessions/history:
    get:
      summary: Past class sessions with attendance or evaluations recorded (coach sees own classes)
      description: Replaces the per-browser history of the coach attendance page. Range defaults to the last 31 days; at most 31 days.
      tags: [Attendance]
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: History, newest session first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoachSessionHistoryItem'
        '400':
          description: ATTENDANCE_INVALID_RANGE

  /classes/sessions/{id}/cancel:
    post:
      summary: Cancel one class session with reason and notify enrolled members (SCRUM-113)
      tags: [Classes & Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSessionRequest'
      responses:
        '200':
          description: Class session cancelled; class enrollments remain active for other sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClassSessionDto'
        '409':
          description: Session is already cancelled
