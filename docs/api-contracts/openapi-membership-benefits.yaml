openapi: 3.0.3
info:
  title: Membership benefits, courses and holds
  version: 2026-11-09
  description: |
    Contract changes from docs/superpowers/specs/2026-11-09-membership-benefits-design.md.
    Sections are added per delivery part (P1 quotas and courses, P2 absences and holds, P3 tier services).
servers:
  - url: /api/v1
paths:
  /classes:
    post:
      deprecated: true
      summary: Retired - one-off classes are no longer created; use POST /classes/recurring
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/sessions/{id}/enroll:
    post:
      deprecated: true
      summary: Retired - enroll in the whole course with POST /classes/{id}/enroll
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/sessions/{id}/bookings:
    post:
      deprecated: true
      summary: Retired - per-session booking; enroll in the whole course instead
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/session-bookings/bulk:
    post:
      deprecated: true
      summary: Retired - bulk per-session booking
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/{id}/enroll:
    post:
      summary: Enroll the member in a recurring course
      description: |
        Consumes one course credit of the active package. The course must end on or before the last day of the
        unbroken run of paid membership periods that covers its start date, otherwise
        403 SCHEDULING_COURSE_EXCEEDS_MEMBERSHIP (renew first). After an upgrade, credits already spent on the
        previous plan still count against the new allowance.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '201': { description: Enrolled }
        '403': { description: SCHEDULING_COURSE_EXCEEDS_MEMBERSHIP or SCHEDULING_COURSE_QUOTA_EXCEEDED }
  /classes/my-quota:
    get:
      summary: Course credits of the member's active package
      description: |
        Adds `enrollBlockedUntil` (date-time, nullable). It is set when the member missed more than 50% of the
        sessions of a course; enrolling or checking out a new course answers 403 SCHEDULING_COURSE_ENROLL_BLOCKED
        until then (30 days). Finished sessions nobody recorded are marked `absent` automatically; late arrivals
        count as present and `excused` sessions are not absences.
      responses:
        '200': { description: Quota with optional enrollBlockedUntil }
  /subscriptions/{id}/hold:
    post:
      summary: Request a hold (multipart/form-data)
      description: |
        Parts: `reason` (required, max 500), `startDate`, `endDate` (ISO dates, inclusive), `documents` (1 to 5 files,
        JPG/PNG/PDF, at most 5 MB each). Rules: the package must allow holds (3-month Silver 7 days, Gold 15,
        Platinum 30; 1-month Platinum 7; 1-month Silver/Gold and the trial cannot be held); one hold per package;
        the start is at least 24 hours away; length is 3 days up to the allowance; the window lies inside the
        membership period. Errors: MEMBERSHIP_HOLD_NOT_ALLOWED, MEMBERSHIP_HOLD_ALREADY_USED,
        MEMBERSHIP_HOLD_DATES_INVALID, MEMBERSHIP_HOLD_TOO_LATE, MEMBERSHIP_HOLD_DURATION_INVALID,
        MEMBERSHIP_HOLD_OUT_OF_PERIOD, MEMBERSHIP_HOLD_DOCUMENT_REQUIRED, MEMBERSHIP_HOLD_DOCUMENT_INVALID.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reason: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                documents: { type: array, items: { type: string, format: binary } }
      responses:
        '200': { description: Pending hold request }
    delete:
      summary: Withdraw a pending hold request (owner)
      responses:
        '200': { description: Hold withdrawn }
    get:
      summary: Hold details with document metadata (owner, receptionist, manager)
      responses:
        '200': { description: HoldRequestDto with holdStartDate, holdEndDate, documents }
  /subscriptions/{id}/hold/documents/{documentId}:
    get:
      summary: Download a medical document (owner, receptionist, manager). Served inline, private, no-store.
      responses:
        '200': { description: File bytes }
        '404': { description: Not found or not attached to this subscription }
  /subscriptions/holds:
    get:
      summary: Hold requests and history for the desk (receptionist, manager)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ALL, PENDING, APPROVED, REJECTED, COMPLETED] } }
      responses:
        '200': { description: List of HoldRequestDto }
  /subscriptions/{id}/hold/approve:
    post:
      summary: Approve a hold
      description: |
        Marks the package as held once. 1:1 sessions and courts inside the window are cancelled; course seats are
        kept and their sessions in the window become `excused`. The membership freezes on the first day (at once
        when it is today) and resumes the day after the last day with the held days added to its end date.
      responses:
        '200': { description: Approved }
