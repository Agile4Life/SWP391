openapi: 3.0.3
info:
  title: Membership benefits, courses and holds
  version: 2026-11-09
  description: |
    Contract changes from docs/superpowers/specs/2026-11-09-membership-benefits-design.md.
    Sections are added per delivery part (P1 quotas and courses, P2 absences and holds, P3 tier services).
servers:
  - url: /api/v1
paths:
  /classes:
    post:
      deprecated: true
      summary: Retired - one-off classes are no longer created; use POST /classes/recurring
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/sessions/{id}/enroll:
    post:
      deprecated: true
      summary: Retired - enroll in the whole course with POST /classes/{id}/enroll
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/sessions/{id}/bookings:
    post:
      deprecated: true
      summary: Retired - per-session booking; enroll in the whole course instead
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/session-bookings/bulk:
    post:
      deprecated: true
      summary: Retired - bulk per-session booking
      responses:
        '400':
          description: SCHEDULING_SINGLE_SESSION_DISABLED
  /classes/{id}/enroll:
    post:
      summary: Enroll the member in a recurring course
      description: |
        Consumes one course credit of the active package. The course must end on or before the last day of the
        unbroken run of paid membership periods that covers its start date, otherwise
        403 SCHEDULING_COURSE_EXCEEDS_MEMBERSHIP (renew first). After an upgrade, credits already spent on the
        previous plan still count against the new allowance.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '201': { description: Enrolled }
        '403': { description: SCHEDULING_COURSE_EXCEEDS_MEMBERSHIP or SCHEDULING_COURSE_QUOTA_EXCEEDED }
  /classes/my-quota:
    get:
      summary: Course credits of the member's active package
      description: |
        Adds `enrollBlockedUntil` (date-time, nullable). It is set when the member missed more than 50% of the
        sessions of a course; enrolling or checking out a new course answers 403 SCHEDULING_COURSE_ENROLL_BLOCKED
        until then (30 days). Finished sessions nobody recorded are marked `absent` automatically; late arrivals
        count as present and `excused` sessions are not absences.
      responses:
        '200': { description: Quota with optional enrollBlockedUntil }
  /subscriptions/{id}/hold:
    post:
      summary: Request a hold (multipart/form-data)
      description: |
        Parts: `reason` (required, max 500), `startDate`, `endDate` (ISO dates, inclusive), `documents` (1 to 5 files,
        JPG/PNG/PDF, at most 5 MB each). Rules: the package must allow holds (3-month Silver 7 days, Gold 15,
        Platinum 30; 1-month Platinum 7; 1-month Silver/Gold and the trial cannot be held); one hold per package;
        the start is at least 24 hours away; length is 3 days up to the allowance; the window lies inside the
        membership period. Errors: MEMBERSHIP_HOLD_NOT_ALLOWED, MEMBERSHIP_HOLD_ALREADY_USED,
        MEMBERSHIP_HOLD_DATES_INVALID, MEMBERSHIP_HOLD_TOO_LATE, MEMBERSHIP_HOLD_DURATION_INVALID,
        MEMBERSHIP_HOLD_OUT_OF_PERIOD, MEMBERSHIP_HOLD_DOCUMENT_REQUIRED, MEMBERSHIP_HOLD_DOCUMENT_INVALID.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reason: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                documents: { type: array, items: { type: string, format: binary } }
      responses:
        '200': { description: Pending hold request }
    delete:
      summary: Withdraw a pending hold request (owner)
      responses:
        '200': { description: Hold withdrawn }
    get:
      summary: Hold details with document metadata (owner, receptionist)
      responses:
        '200': { description: HoldRequestDto with holdStartDate, holdEndDate, documents }
  /subscriptions/{id}/hold/documents/{documentId}:
    get:
      summary: Download a medical document (owner, receptionist, manager). Served inline, private, no-store.
      responses:
        '200': { description: File bytes }
        '404': { description: Not found or not attached to this subscription }
  /subscriptions/holds:
    get:
      summary: Hold requests and history for the desk (receptionist only)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ALL, PENDING, APPROVED, REJECTED, COMPLETED] } }
      responses:
        '200': { description: List of HoldRequestDto }
  /subscriptions/{id}/hold/approve:
    post:
      summary: Approve a hold
      description: |
        Marks the package as held once. 1:1 sessions and courts inside the window are cancelled; course seats are
        kept and their sessions in the window become `excused`. The membership freezes on the first day (at once
        when it is today) and resumes the day after the last day with the held days added to its end date.
      responses:
        '200': { description: Approved }
  /subscriptions/{id}/hold/policy:
    get:
      summary: Hold allowance of the member's subscription (drives the request form)
      responses:
        '200':
          description: "{allowed, alreadyUsed, minDays, maxDays, noticeHours, maxDocuments, maxDocumentBytes}"
  /shop/quote:
    post:
      summary: Quote a cart; a signed-in Gold or Platinum member gets the tier discount on the products
      description: |
        The response adds `discountPercent` (0, 10, 20) and `discountAmount`. `subtotal` stays the list price and
        `total = subtotal - discountAmount + shippingFee`. Shipping is never discounted and free shipping is judged on
        the list price. Creating the order applies the same percentage; the order stores
        `subtotal = list - discount` plus memberDiscountPercent/memberDiscountAmount so `total = subtotal + shippingFee` holds.
      responses:
        '200': { description: Quote with discountPercent and discountAmount }
  /classes/{id}/checkout:
    post:
      summary: Pay the fee of a course beyond the free credits
      description: The fee is reduced by the tier discount of the active package (Gold 10%, Platinum 20%); the payment note records the percentage and the list price. `GET /classes/my-quota` returns `discountPercent`.
      responses:
        '201': { description: Checkout with the discounted amount }
  /members/{memberId}/health-metrics/batch:
    post:
      summary: Record several measurements of one assessment at once
      description: |
        Coach, manager and receptionist (intake). Body `{ metrics: [{ metricName, metricValue, unit }] }` with 1-10 distinct
        items among weight (kg), height (cm), body_fat (%), muscle_mass (kg), waist (cm). BMI is never submitted: it is derived
        once from the resulting height and weight (400 HEALTH_BMI_AUTOMATIC when sent, 400 HEALTH_DUPLICATE_METRIC for a
        repeated measurement). Tier rules of POST /health/metrics apply to every item and the batch is atomic.
        Any coach may measure a member who has no measurements yet; later ones belong to the assigned coach.
      responses:
        '200': { description: The recorded measurements (the derived BMI row is not included) }
  /health/metrics:
    post:
      summary: Record a measurement (tier rules)
      description: |
        body_fat and muscle_mass need an active Platinum package (403 HEALTH_DEEP_ASSESSMENT_PLATINUM). A member whose
        active package is Silver gets the first assessment only: a measurement after the day of the first one answers
        403 HEALTH_PERIODIC_ASSESSMENT_GOLD. Members without an active package are not restricted.
      responses:
        '201': { description: Recorded }
  /coaching/training-plans/my:
    get:
      summary: The member's active training plans
      description: Empty for members whose active package is Silver; GET /coaching/training-plans/{id} answers 403 COACHING_PLAN_TIER_REQUIRED for them. Coaches and managers still see and write plans, which appear after an upgrade.
      responses:
        '200': { description: Plans (empty for Silver) }
  /classes/enrollments/my:
    get:
      summary: The member's course enrollments with progress
      description: |
        Each item adds `totalSessions` (not cancelled), `attendedSessions` (present or late) and `remainingSessions`
        (total minus attended, missed and excused: a missed session is not made up). Entering the center through the
        gate from 30 minutes before a booked course session until its end marks it `present` (`late` when the scan is
        more than 15 minutes after the start); a coach's own record is never overwritten.
      responses:
        '200': { description: Enrollments with totalSessions, attendedSessions, remainingSessions }
  /classes/recurring:
    post:
      summary: Create a recurring course that repeats weekly
      description: |
        A course needs `recurringDays` (MONDAY...) and meets on those weekdays every week between `startDate` and
        `endDate` (400 SCHEDULING_NO_RECURRING_DAYS when none is chosen). Monthly repetition (`repeatType`,
        `monthDays`) was removed: the fields are no longer accepted nor returned.
      responses:
        '201': { description: Course with all its sessions }
  /coaching/bookings:
    get:
      summary: 1:1 sessions (CoachBookingDto)
      description: |
        Adds `attendedAt` (date-time, nullable). A gate scan from 30 minutes before a session until its end sets it. A
        sweep every 30 minutes also sets it for finished sessions that a granted visit covered, as long as the visit began
        at most 3 hours before the start (a member who came in early and stayed). A finished session with a null
        `attendedAt` is a no-show; its quota stays used.
      responses:
        '200': { description: Bookings with attendedAt }
  /coach-bookings/attendance:
    get:
      summary: 1:1 sessions with their arrival (coach, receptionist, manager)
      description: |
        A coach reads their own sessions; a receptionist or manager reads everyone's. Query: `from`, `to` (ISO dates;
        default the last 14 days; at most 62 days, otherwise 400 COACH_BOOKING_ATTENDANCE_RANGE) and `outcome`
        (ALL, ATTENDED, MISSED, UPCOMING). Cancelled sessions are never returned. MISSED is a finished session without
        `attendedAt`. Members get 403.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: outcome, in: query, schema: { type: string, enum: [ALL, ATTENDED, MISSED, UPCOMING] } }
      responses:
        '200': { description: List of CoachBookingDto }
  /coach-bookings/{id}/mark-attended:
    post:
      summary: Record that the member attended a 1:1 session (forgot to scan)
      description: |
        Coach (own sessions only), receptionist or manager. The session must have started (400 COACH_BOOKING_NOT_STARTED)
        and not be cancelled (409). Sets `attendedAt` to now; marking again keeps the first time. Audited as PT_ATTENDANCE_MARK.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: The booking with attendedAt }
  /members/kyc/pending:
    get:
      summary: Identity submissions waiting for review (receptionist, manager)
      description: |
        A submission through POST /profile/kyc no longer verifies the member: it becomes `kycStatus` PENDING until the
        desk approves it. The identity number is stored encrypted (AES-256-GCM, `citizen_id_encrypted`); the profile and
        the member only ever see the masked form (`********1234`); this list decrypts it for the reviewer. Existing
        plaintext numbers are encrypted at startup. Buying a first package while PENDING answers
        400 MEMBERSHIP_KYC_PENDING.
      responses:
        '200': { description: "[{memberId, membershipCode, fullName, documentType, citizenId, nationality, frontImageUrl, backImageUrl, submittedAt}]" }
  /members/kyc/{memberId}/approve:
    post:
      summary: Approve an identity submission (the member may now buy a package)
      responses:
        '200': { description: Approved }
        '409': { description: KYC_NOT_PENDING }
  /members/kyc/{memberId}/reject:
    post:
      summary: Reject an identity submission with a reason (the member submits again)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 255 } }, required: [reason] }
      responses:
        '200': { description: Rejected }
        '400': { description: KYC_REJECT_REASON_REQUIRED }
  /classes/{classId}/students:
    get:
      summary: Students of a class
      description: A coach reads only the classes they teach (403 otherwise). The front desk gets contact details with `healthNotes` blanked. Managers see everything. The same rules apply to /classes/sessions/{id}/students.
      responses:
        '200': { description: Students }
  /check-in/scan:
    post:
      summary: Gate scan
      description: Only rotating signed codes (`DYN:...`, 60 seconds) are accepted. A static code is recorded as DENIED with error.attendance.static_qr_rejected.
      responses:
        '201': { description: Check-in record (GRANTED or DENIED) }
  /classes/enrollments/{id}:
    delete:
      summary: Cancel a course enrollment
      description: A member cannot cancel once the course has started (400 SCHEDULING_CANNOT_CANCEL_STARTED_COURSE), so the credit is not handed back; the desk can. Cancelling before the start voids the unpaid fee.
      responses:
        '200': { description: Cancelled }
  /health/metrics#cycle:
    post:
      summary: One assessment day per 30-day cycle (Gold, Platinum, trial)
      description: |
        Measurements taken on one day are one assessment. Once a day of the current cycle (counted from the plan, an
        upgrade keeps the original start) has measurements, another day answers 403 HEALTH_ASSESSMENT_CYCLE_USED with the
        day used and the start of the next cycle. Measurements from before the cycle, such as the first assessment, do
        not count.
      responses:
        '403': { description: HEALTH_ASSESSMENT_CYCLE_USED }
  /subscriptions/{id}/resume:
    post:
      summary: Resume a frozen membership early
      description: Course sessions that the hold had excused from the resume day on become ordinary sessions again.
      responses:
        '200': { description: Resumed }
  /coach-bookings/{id}/unmark-attended:
    post:
      summary: Remove a wrong attendance mark of a 1:1 session
      description: Coach (own sessions), receptionist or manager. Clears `attendedAt` and locks the session so a gate scan or the sweep does not record it again; marking by hand unlocks it. Audited as PT_ATTENDANCE_UNMARK.
      responses:
        '200': { description: The booking without attendedAt }
  /subscriptions/{id}/hold#approval:
    post:
      summary: Hold approval, late approval and withdrawal
      description: |
        Approving after the requested first day starts the hold today: days already lived are not held and not added
        back. A hold whose whole period has passed answers 400 MEMBERSHIP_HOLD_WINDOW_PASSED (reject it instead).
        `DELETE /subscriptions/{id}/hold` also withdraws an approved hold that has not started: the package gets its one
        hold back, bookings released at approval are not restored. Benefit cycles (PT, courts, the assessment) do not
        count held days: a cycle that contains the hold is stretched by its length.
      responses:
        '200': { description: ok }
  /subscriptions/{id}/hold/withdraw:
    post:
      summary: Desk withdraws a hold on behalf of the member (receptionist only)
      description: Allowed for a pending request or an approved hold that has not started (400 MEMBERSHIP_HOLD_NOT_PENDING otherwise). The package gets its one hold back, course excuses of the window are released and the member is notified.
      responses:
        '200': { description: Subscription without a hold }
