openapi: 3.0.3
info:
  title: SCMS Private Direct Chat — SCRUM-106 / SCRUM-128 extension
  version: 1.0.0
  description: Member initiates private conversations with active Receptionist/Coach. All reads and writes require application JWT. Center Managers have no access.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /chat/contacts:
    get:
      summary: Member searches active receptionists/coaches; excludes deleted accounts
      parameters:
        - {name: query, in: query, schema: {type: string, maxLength: 80, default: ''}}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200':
          description: Paginated contacts; fixed page size 20
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/Page'}
                          - properties: {content: {type: array, items: {$ref: '#/components/schemas/Contact'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /chat/conversations:
    get:
      summary: List only caller's conversations, latest activity then ID descending
      parameters:
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200':
          description: Fixed page size 20; only MEMBER, RECEPTIONIST, COACH
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/Page'}
                          - properties: {content: {type: array, items: {$ref: '#/components/schemas/Conversation'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Member opens or reuses the unique conversation with an active Receptionist/Coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactId]
              properties: {contactId: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Existing or newly created conversation; safe to repeat and race
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties: {data: {$ref: '#/components/schemas/Conversation'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /chat/conversations/{id}/messages:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      summary: Participants read chronological message history, up to 50 items
      description: Omit cursors for the latest 50 messages. beforeId gets older messages; afterId gets the earliest next 50 messages. Use afterId=0 to catch up from an initially empty conversation. Never combine cursors. hasMore indicates more in that direction. For catch-up, repeat afterId with the latest returned ID until hasMore is false.
      parameters:
        - {name: beforeId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: afterId, in: query, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Only participants; inactive peer's historical messages remain readable
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties:
                      data:
                        type: object
                        required: [items, hasMore]
                        properties:
                          items: {type: array, items: {$ref: '#/components/schemas/Message'}}
                          hasMore: {type: boolean}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Send a plain-text message, idempotent for conversation/sender/clientMessageId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientMessageId, message]
              properties:
                clientMessageId: {type: string, format: uuid}
                message: {type: string, minLength: 1, maxLength: 2000, description: Trimmed on server; whitespace-only rejected}
      responses:
        '200':
          description: Persisted message, or original on identical retry
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties: {data: {$ref: '#/components/schemas/Message'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Peer unavailable or UUID reused with different message text, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
  /chat/realtime-session:
    post:
      summary: Obtain a short-lived receive-only Supabase JWT for caller's private inbox channel
      description: No application JWT reuse. No-store response. Token lasts 5 minutes; refresh before expiry. Server configuration missing yields enabled=false. Broadcast event changed carries no chat contents; fetch authorized API for changes.
      responses:
        '200':
          description: Realtime connection metadata for current active chat user
          headers:
            Cache-Control: {schema: {type: string, example: no-store}}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties:
                      data:
                        type: object
                        required: [enabled, userId]
                        properties:
                          enabled: {type: boolean}
                          userId: {type: integer, format: int64}
                          url: {type: string, nullable: true}
                          publishableKey: {type: string, nullable: true}
                          topic: {type: string, nullable: true, example: 'scms:chat:42'}
                          token: {type: string, nullable: true}
                          expiresAt: {type: string, format: date-time, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
  responses:
    Unauthorized: {description: Missing/expired application JWT, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    Forbidden: {description: Role not allowed or caller is not a participant, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    NotFound: {description: Conversation or active contact does not exist, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
    Invalid: {description: Invalid body, page or cursor, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
  schemas:
    Envelope:
      type: object
      required: [success, status, message]
      properties:
        success: {type: boolean}
        status: {type: integer}
        message: {type: string, description: Localized by Accept-Language, default vi}
        code: {type: string}
        data: {}
    Page:
      type: object
      required: [content, totalPages, number]
      properties:
        content: {type: array, items: {}}
        totalPages: {type: integer}
        number: {type: integer}
    Contact:
      type: object
      required: [id, name, role, available]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        role: {type: string, description: Current role; directory contains RECEPTIONIST/COACH only. A historical peer may have changed role and is then unavailable.}
        available: {type: boolean}
    Conversation:
      type: object
      required: [id, peer, createdAt, lastActivityAt]
      properties:
        id: {type: integer, format: int64}
        peer: {$ref: '#/components/schemas/Contact'}
        createdAt: {type: string, format: date-time}
        lastActivityAt: {type: string, format: date-time}
    Message:
      type: object
      required: [id, conversationId, clientMessageId, senderId, mine, message, createdAt]
      properties:
        id: {type: integer, format: int64}
        conversationId: {type: integer, format: int64}
        clientMessageId: {type: string, format: uuid}
        senderId: {type: integer, format: int64}
        mine: {type: boolean}
        message: {type: string}
        createdAt: {type: string, format: date-time}
