openapi: 3.0.3
info:
  title: SCMS AI Chat — SCRUM-126 / SCRUM-118 integration
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Session:
      type: object
      properties:
        id: {type: integer, format: int64}
        memberId: {type: integer, format: int64}
        topic: {type: string}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
    Message:
      type: object
      properties:
        id: {type: integer, format: int64}
        sessionId: {type: integer, format: int64}
        sender: {type: string, enum: [member, ai]}
        message: {type: string}
        createdAt: {type: string, format: date-time}
    Reply:
      type: object
      properties:
        sessionId: {type: integer, format: int64}
        memberMessage: {$ref: '#/components/schemas/Message'}
        aiMessage: {$ref: '#/components/schemas/Message'}
        reply: {type: string}
  responses:
    ProviderUnavailable:
      description: 'HTTP 503 with ApiResponse code AI_CHAT_NOT_CONFIGURED or AI_CHAT_UNAVAILABLE; no synthetic reply, no message pair is persisted.'
paths:
  /ai/chat/sessions:
    get:
      summary: List sessions of the authenticated member, newest first
      responses:
        '200':
          description: ApiResponse with data array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Session'}}
        '401': {description: Unauthenticated}
    post:
      summary: Create a persisted session without calling the AI provider
      description: MEMBER may omit memberId; backend resolves authenticated ID and rejects another member's ID.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId: {type: integer, format: int64}
                topic: {type: string, maxLength: 150}
      responses:
        '201':
          description: ApiResponse with new session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Session'}
        '400': {description: Invalid topic}
        '401': {description: Unauthenticated}
        '403': {description: MEMBER attempted to create another member's session}
  /ai/chat/sessions/{id}/messages:
    post:
      summary: Send a question and persist a provider-generated answer
      description: 'JSON response, not SSE. Frontend types the returned answer. MEMBER ownership is checked before provider access. No POST retry after an uncertain transport failure: reload history first. Staff roles retain existing permissions.'
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: ApiResponse with persisted member/AI message pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Reply'}
        '400': {description: Blank or oversized message}
        '401': {description: Unauthenticated}
        '403': {description: Session belongs to another MEMBER}
        '404': {description: Session missing}
        '503': {$ref: '#/components/responses/ProviderUnavailable'}
  /ai/chat/sessions/{id}/history:
    get:
      summary: Read authorized session history ordered by createdAt then ID
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: ApiResponse with messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Message'}}
        '401': {description: Unauthenticated}
        '403': {description: Session belongs to another MEMBER}
        '404': {description: Session missing}
