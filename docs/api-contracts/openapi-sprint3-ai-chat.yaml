openapi: 3.0.3
info:
  title: SCMS AI Chat — SCRUM-126 / SCRUM-118 integration
  version: 1.1.0
  description: >-
    Roles: MEMBER chats with their own profile, plan and bookings as context. RECEPTIONIST and CENTER_MANAGER get desk
    sessions (memberId null) answered from centre-wide data only (prices, tier benefits, classes, rules). COACH receives
    403 on every endpoint here; coaches use the AI only through POST /ai/generate-workout-plan.
    Every session is private to the account that created it.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Session:
      type: object
      properties:
        id: {type: integer, format: int64}
        memberId: {type: integer, format: int64, nullable: true, description: 'Null for a reception/manager desk session.'}
        topic: {type: string}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
    Message:
      type: object
      properties:
        id: {type: integer, format: int64}
        sessionId: {type: integer, format: int64}
        sender: {type: string, enum: [member, ai]}
        message: {type: string}
        createdAt: {type: string, format: date-time}
    Reply:
      type: object
      properties:
        sessionId: {type: integer, format: int64}
        memberMessage: {$ref: '#/components/schemas/Message'}
        aiMessage: {$ref: '#/components/schemas/Message'}
        reply: {type: string}
  responses:
    RateLimited:
      description: 'HTTP 429 with ApiResponse code AI_CHAT_RATE_LIMITED: one account may send at most 15 messages to the assistant in any rolling 10 minutes (app.ai.chat.rate-limit.max-messages / window-minutes). Counted from stored member messages, so it holds across restarts and instances. The message states how many minutes to wait; nothing is sent to the provider and nothing is persisted, so the client keeps the draft. The same limit applies to POST /ai/chat/message(s).'
    ProviderUnavailable:
      description: 'HTTP 503 with ApiResponse code AI_CHAT_NOT_CONFIGURED or AI_CHAT_UNAVAILABLE; no synthetic reply, no message pair is persisted.'
paths:
  /ai/chat/sessions:
    get:
      summary: List the caller's own sessions (member sessions, or desk sessions for staff), newest first
      responses:
        '200':
          description: ApiResponse with data array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Session'}}
        '401': {description: Unauthenticated}
    post:
      summary: Create a persisted session without calling the AI provider
      description: MEMBER may omit memberId; backend resolves authenticated ID and rejects another member's ID. RECEPTIONIST and CENTER_MANAGER always get their own desk session; memberId is ignored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId: {type: integer, format: int64}
                topic: {type: string, maxLength: 150}
      responses:
        '201':
          description: ApiResponse with new session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Session'}
        '400': {description: Invalid topic}
        '401': {description: Unauthenticated}
        '403': {description: MEMBER attempted to create another member's session, or the caller is a COACH}
  /ai/chat/sessions/{id}/messages:
    post:
      summary: Send a question and persist a provider-generated answer
      description: 'JSON response, not SSE. Frontend types the returned answer. MEMBER ownership is checked before provider access. No POST retry after an uncertain transport failure: reload history first. Staff roles retain existing permissions.'
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: ApiResponse with persisted member/AI message pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Reply'}
        '400': {description: Blank or oversized message}
        '401': {description: Unauthenticated}
        '403': {description: Session belongs to another MEMBER}
        '404': {description: Session missing}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ProviderUnavailable'}
  /ai/chat/sessions/{id}/history:
    get:
      summary: Read authorized session history ordered by createdAt then ID
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: ApiResponse with messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Message'}}
        '401': {description: Unauthenticated}
        '403': {description: Session belongs to another MEMBER}
        '404': {description: Session missing}
