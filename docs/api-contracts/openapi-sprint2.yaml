openapi: 3.0.3
info:
  title: SCMS API - Sprint 2 Contract (Notifications & Support Requests)
  version: 1.0.0
  description: >
    API contracts for Sprint 2 features:
    - Module I1: In-App Notification Module (SCRUM-67)
    - Module I2: Support Requests / Tickets Module (SCRUM-68)
    All endpoints require Bearer JWT authentication and enforce RBAC via @PreAuthorize.
    Responses are wrapped in the standard ApiResponse payload.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: integer
        message:
          type: string
          description: Localized message (vi/en)
        code:
          type: string
          description: Error code when success is false
        data:
          description: Payload
        details:
          description: Validation or error details
        timestamp:
          type: string
          format: date-time

    # --- Notifications Schemas ---
    NotificationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [schedule_change, package_expiry, class_reminder, system, support_reply, payment]
        relatedEntityType:
          type: string
          nullable: true
        relatedEntityId:
          type: integer
          format: int64
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UnreadCountDto:
      type: object
      properties:
        count:
          type: integer
          format: int64

    # --- Support Requests Schemas ---
    CreateSupportRequestDto:
      type: object
      required:
        - subject
      properties:
        subject:
          type: string
          maxLength: 150
          example: "Kẹt tủ đồ phòng thay đồ nam"
        description:
          type: string
          nullable: true
          example: "Tủ số 12 bị kẹt ổ khóa không mở được"

    UpdateSupportRequestStatusDto:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          example: "in_progress"
        assignedTo:
          type: integer
          format: int64
          nullable: true
          example: 2

    SupportRequestDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        memberName:
          type: string
        assignedTo:
          type: integer
          format: int64
          nullable: true
        assignedToName:
          type: string
          nullable: true
        subject:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    # --- Scheduling Schemas (SCRUM-72, 73, 74) ---
    CreateClassRequest:
      type: object
      required:
        - name
        - disciplineId
        - coachId
        - roomId
        - capacity
      properties:
        name:
          type: string
          maxLength: 150
        disciplineId:
          type: integer
          format: int64
        coachId:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        capacity:
          type: integer
          minimum: 1
        level:
          type: string
          enum: [beginner, intermediate, advanced, all]
          default: all
        description:
          type: string

    CreateSessionRequest:
      type: object
      required:
        - sessionDate
        - startTime
        - endTime
      properties:
        sessionDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    GymClassDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        disciplineId:
          type: integer
          format: int64
        disciplineName:
          type: string
        coachId:
          type: integer
          format: int64
        coachName:
          type: string
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
        capacity:
          type: integer
        level:
          type: string
        status:
          type: string
        description:
          type: string

    ClassSessionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        gymClassId:
          type: integer
          format: int64
        className:
          type: string
        disciplineId:
          type: integer
          format: int64
        disciplineName:
          type: string
        coachId:
          type: integer
          format: int64
        coachName:
          type: string
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
        sessionDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          type: string
        cancellationReason:
          type: string
          nullable: true
        capacity:
          type: integer
        bookedCount:
          type: integer
          format: int64

    ClassEnrollmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        gymClassId:
          type: integer
          format: int64
        className:
          type: string
        memberId:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
          nullable: true
        sessionDate:
          type: string
          format: date
          nullable: true
        startTime:
          type: string
          format: time
          nullable: true
        endTime:
          type: string
          format: time
          nullable: true
        status:
          type: string
        enrolledAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true

    ClassWaitlistDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        gymClassId:
          type: integer
          format: int64
        className:
          type: string
        memberId:
          type: integer
          format: int64
        status:
          type: string
        requestedAt:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  # ==========================================
  # Notifications Endpoints
  # ==========================================
  /notifications:
    get:
      summary: Lấy danh sách thông báo của người dùng hiện tại (phân trang)
      tags: [Notifications]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/NotificationDto'
        '401':
          description: Chưa xác thực (UNAUTHORIZED)

  /notifications/unread-count:
    get:
      summary: Đếm số lượng thông báo chưa đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UnreadCountDto'
        '401':
          description: Chưa xác thực

  /notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
        '404':
          description: Không tìm thấy thông báo

  /notifications/read-all:
    patch:
      summary: Đánh dấu tất cả thông báo của người dùng là đã đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công

  # ==========================================
  # Support Requests Endpoints
  # ==========================================
  /support/requests:
    post:
      summary: Tạo phiếu yêu cầu hỗ trợ / khiếu nại mới (Chỉ MEMBER)
      tags: [Support]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportRequestDto'
      responses:
        '200':
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Dữ liệu không hợp lệ (VALIDATION_ERROR)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

    get:
      summary: Xem toàn bộ danh sách phiếu yêu cầu hỗ trợ (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/my:
    get:
      summary: Lấy lịch sử yêu cầu hỗ trợ của chính hội viên đang đăng nhập (Chỉ MEMBER)
      tags: [Support]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/{id}/status:
    patch:
      summary: Cập nhật trạng thái phiếu hỗ trợ và người phụ trách (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupportRequestStatusDto'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Lỗi state machine chuyển trạng thái hoặc validation (INVALID_STATE_TRANSITION)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)
        '404':
          description: Phiếu hỗ trợ không tồn tại

  # ==========================================
  # Classes & Scheduling Endpoints (SCRUM-72, 73, 74)
  # ==========================================
  /classes:
    post:
      summary: Tạo lớp học mới (CENTER_MANAGER)
      tags: [Classes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: Tạo lớp học thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/GymClassDto'
        '400':
          description: Dữ liệu không hợp lệ
        '403':
          description: Quyền truy cập bị từ chối
    get:
      summary: Danh sách lớp học
      tags: [Classes]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GymClassDto'

  /classes/{id}/sessions:
    post:
      summary: Xếp lịch buổi học (CENTER_MANAGER)
      tags: [Classes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Tạo lịch học thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClassSessionDto'
        '400':
          description: Lỗi thời gian hoặc dữ liệu không hợp lệ
        '403':
          description: Quyền truy cập bị từ chối
        '409':
          description: Trùng lịch phòng hoặc huấn luyện viên (Trigger P3)

  /classes/sessions:
    get:
      summary: Tra cứu lịch học theo bộ lọc
      tags: [Classes]
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: disciplineId
          in: query
          schema:
            type: integer
            format: int64
        - name: coachId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassSessionDto'

  /classes/sessions/{id}/enroll:
    post:
      summary: Đăng ký tham gia buổi học (MEMBER)
      tags: [Enrollments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClassEnrollmentDto'
        '400':
          description: Buổi học không hợp lệ hoặc đã qua
        '403':
          description: Gói tập chưa kích hoạt hoặc đã hết hạn (Trigger P4)
        '409':
          description: Lớp đã đầy chỗ (Trigger P2) hoặc đã đăng ký trước đó

  /classes/enrollments/{id}:
    delete:
      summary: Hủy đăng ký buổi học (MEMBER hoặc Staff/Manager)
      tags: [Enrollments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Hủy thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClassEnrollmentDto'
        '400':
          description: Không ở trạng thái booked
        '403':
          description: Không có quyền hủy đăng ký của người khác

  /classes/enrollments/my:
    get:
      summary: Danh sách đăng ký lớp học của hội viên hiện tại (MEMBER)
      tags: [Enrollments]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassEnrollmentDto'

  /classes/sessions/{id}/waitlist:
    post:
      summary: Tham gia danh sách chờ khi lớp đã đầy chỗ (MEMBER)
      tags: [Waitlist]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Đăng ký danh sách chờ thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClassWaitlistDto'
        '400':
          description: Lớp còn chỗ hoặc đã đăng ký/chờ trước đó
        '403':
          description: Gói tập không hợp lệ (Trigger P4)

  /classes/waitlists/{id}:
    delete:
      summary: Rút khỏi danh sách chờ (MEMBER)
      tags: [Waitlist]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Rút khỏi danh sách chờ thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClassWaitlistDto'
        '400':
          description: Không ở trạng thái waiting
        '403':
          description: Không phải người tạo yêu cầu

  /classes/waitlists/my:
    get:
      summary: Danh sách chờ của hội viên hiện tại (MEMBER)
      tags: [Waitlist]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassWaitlistDto'
