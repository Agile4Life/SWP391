openapi: 3.0.3
info:
  title: SCMS API - Sprint 2 Contract
  version: 1.0.0
  description: >
    Endpoint contract for Sprint 2 (Membership Subscriptions, Scheduling, Enrollments, Waitlists, Center QR Check-in).
    All responses use the ApiResponse envelope. Messages are localized via the Accept-Language header (default vi).
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: integer }
        message: { type: string, description: Localized message }
        code: { type: string, description: Error code, present on errors }
        data: { description: Payload }
        details: { description: Field errors for validation failures }
        timestamp: { type: string, format: date-time }
    SubscriptionDto:
      type: object
      properties:
        id: { type: integer }
        memberId: { type: integer }
        packageId: { type: integer }
        packageName: { type: string }
        previousSubscriptionId: { type: integer, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [pending_payment, active, expired, cancelled] }
        qrCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SubscriptionCreateRequest:
      type: object
      required: [packageId]
      properties:
        packageId: { type: integer, minimum: 1 }
    GymClassDto:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        disciplineId: { type: integer }
        disciplineName: { type: string }
        coachId: { type: integer }
        coachName: { type: string }
        roomId: { type: integer }
        roomName: { type: string }
        capacity: { type: integer }
        level: { type: string, enum: [beginner, intermediate, advanced, all] }
        status: { type: string, enum: [active, inactive, archived] }
    ClassCreateRequest:
      type: object
      required: [name, disciplineId, coachId, roomId, capacity, level]
      properties:
        name: { type: string, maxLength: 150 }
        disciplineId: { type: integer }
        coachId: { type: integer }
        roomId: { type: integer }
        capacity: { type: integer, minimum: 1 }
        level: { type: string, enum: [beginner, intermediate, advanced, all] }
    ClassSessionDto:
      type: object
      properties:
        id: { type: integer }
        classId: { type: integer }
        className: { type: string }
        sessionDate: { type: string, format: date }
        startTime: { type: string, example: "08:00:00" }
        endTime: { type: string, example: "09:30:00" }
        status: { type: string, enum: [scheduled, completed, cancelled] }
    SessionScheduleRequest:
      type: object
      required: [sessionDate, startTime, endTime]
      properties:
        sessionDate: { type: string, format: date }
        startTime: { type: string, example: "08:00:00" }
        endTime: { type: string, example: "09:30:00" }
    EnrollmentDto:
      type: object
      properties:
        id: { type: integer }
        classId: { type: integer }
        className: { type: string }
        memberId: { type: integer }
        sessionId: { type: integer, nullable: true }
        sessionDate: { type: string, format: date, nullable: true }
        startTime: { type: string, nullable: true }
        endTime: { type: string, nullable: true }
        status: { type: string, enum: [booked, cancelled, completed] }
        enrolledAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
    WaitlistDto:
      type: object
      properties:
        id: { type: integer }
        classId: { type: integer }
        className: { type: string }
        memberId: { type: integer }
        status: { type: string, enum: [waiting, notified, expired] }
        requestedAt: { type: string, format: date-time }
    CheckinDto:
      type: object
      properties:
        id: { type: integer }
        memberId: { type: integer }
        memberName: { type: string }
        membershipCode: { type: string }
        checkInTime: { type: string, format: date-time }
        checkOutTime: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [qr, manual] }
        gate: { type: string, nullable: true }
        recordedById: { type: integer, nullable: true }
        status: { type: string, enum: [GRANTED, DENIED] }
    CheckinScanRequest:
      type: object
      required: [qrCode]
      properties:
        qrCode: { type: string }
        gate: { type: string }
security:
  - bearerAuth: []
paths:
  # SCRUM-71: Membership Subscriptions
  /memberships/subscriptions:
    post:
      summary: Create a subscription pending payment (SCRUM-71)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreateRequest' }
      responses:
        '201': { description: Created (SubscriptionDto) }
        '400': { description: Bad request or inactive package }
        '409': { description: Already has active subscription }
  /memberships/subscriptions/{id}/renew:
    post:
      summary: Create a renewal pending payment (SCRUM-71)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Created (SubscriptionDto) }
        '403': { description: Not owner }
        '404': { description: Subscription not found }
  /memberships/subscriptions/my:
    get:
      summary: List authenticated member's subscriptions with QR codes (SCRUM-71)
      responses:
        '200': { description: OK (SubscriptionDto[]) }

  # SCRUM-72: Classes & Sessions
  /classes:
    post:
      summary: Create gym class (CENTER_MANAGER) (SCRUM-72)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassCreateRequest' }
      responses:
        '201': { description: Created (GymClassDto) }
        '400': { description: Bad request }
  /classes/{id}/sessions:
    post:
      summary: Schedule a class session with trigger P3 conflict check (SCRUM-72)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionScheduleRequest' }
      responses:
        '201': { description: Created (ClassSessionDto) }
        '409': { description: Schedule conflict (Coach or Room already booked) }
  /classes/sessions:
    get:
      summary: List class sessions with filters (SCRUM-72)
      parameters:
        - name: classId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK (ClassSessionDto[]) }

  # SCRUM-73: Class Enrollments
  /classes/sessions/{id}/enroll:
    post:
      summary: Book a seat in a session with trigger P2 & P4 check (MEMBER) (SCRUM-73)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Booked (EnrollmentDto) }
        '400': { description: Session cancelled or past due }
        '403': { description: Membership expired or inactive (Trigger P4) }
        '409': { description: Class full (Trigger P2) or already booked }
  /classes/enrollments/{id}:
    delete:
      summary: Cancel booking and release seat (Owner or Staff) (SCRUM-73)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Cancelled (EnrollmentDto) }
        '400': { description: Not booked }
        '403': { description: Not owner }
        '404': { description: Not found }

  # SCRUM-74: Class Waitlists
  /classes/sessions/{id}/waitlist:
    post:
      summary: Join waitlist when class is full (MEMBER) (SCRUM-74)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Joined waitlist (WaitlistDto) }
        '400': { description: Class has space or duplicate waitlist or session not open }
        '403': { description: Inactive membership }
  /classes/waitlists/{id}:
    delete:
      summary: Withdraw from waitlist (Owner only) (SCRUM-74)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Withdrawn (WaitlistDto) }
        '403': { description: Not owner }
        '404': { description: Not found }
  /classes/waitlists/my:
    get:
      summary: List authenticated member's waitlist entries (SCRUM-74)
      responses:
        '200': { description: OK (WaitlistDto[]) }

  # SCRUM-75: Center QR Check-in
  /check-in/scan:
    post:
      summary: Scan QR code at entrance with trigger P4 check (Staff only) (SCRUM-75)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckinScanRequest' }
      responses:
        '201': { description: Access granted (CheckinDto) }
        '403': { description: Access denied (Trigger P4: Inactive/expired membership or invalid QR) }
        '409': { description: Already checked in and not checked out }
  /check-in/{id}/checkout:
    post:
      summary: Check out of center (SCRUM-75)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Checked out (CheckinDto) }
        '400': { description: Already checked out }
        '403': { description: Not owner }
        '404': { description: Not found }
  /check-in/history:
    get:
      summary: Get today's center check-in history (Staff only) (SCRUM-75)
      responses:
        '200': { description: OK (CheckinDto[]) }
