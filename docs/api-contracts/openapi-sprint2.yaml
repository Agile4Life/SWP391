          application/json:
            schema:
              $ref: '#/components/schemas/CheckinScanRequest'
      responses:
        '201':
          description: Ghi nhận lượt quét thành công (GRANTED hoặc DENIED)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CheckinDto'
        '400':
          description: Dữ liệu quét không hợp lệ (mã trống)
        '403':
          description: Quyền truy cập bị từ chối (Chỉ RECEPTIONIST hoặc CENTER_MANAGER)

  /check-in/{id}/checkout:
    post:
      summary: Ghi nhận checkout rời trung tâm (RECEPTIONIST, CENTER_MANAGER)
      tags: [Check-in]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Checkout thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CheckinDto'
        '400':
