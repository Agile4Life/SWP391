openapi: 3.0.3
info:
  title: SCMS API - Sprint 2 Contract
  version: 1.0.0
  description: >
    API contracts for Sprint 2 features:
    - Module I1: In-App Notification Module (SCRUM-67)
    - Module I2: Support Requests / Tickets Module (SCRUM-68)
    - Module E: Membership Subscriptions (SCRUM-71)
    - Module C: Class Scheduling & Sessions (SCRUM-72)
    - Module C: Class Enrollments & Booking (SCRUM-73)
    - Module C: Smart Waitlist (SCRUM-74)
    - Module D: Center QR Check-in & Gate Access (SCRUM-75)
    All responses use the ApiResponse envelope. Messages are localized via the Accept-Language header (default vi).
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string, description: Localized message }
        code: { type: string, description: Error code, present on errors }
        data: { description: Payload }
        details: { description: Field errors for validation failures }
        timestamp: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        status: { type: integer, example: 400 }
        code: { type: string, example: "BAD_REQUEST" }
        message: { type: string, example: "Dữ liệu không hợp lệ" }
        details: { type: object, nullable: true }
        timestamp: { type: string, format: date-time }

    # --- Notifications Schemas (SCRUM-67) ---
    NotificationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [schedule_change, package_expiry, class_reminder, system, support_reply, payment]
        relatedEntityType:
          type: string
          nullable: true
        relatedEntityId:
          type: integer
          format: int64
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UnreadCountDto:
      type: object
      properties:
        count:
          type: integer
          format: int64

    # --- Support Requests Schemas (SCRUM-68) ---
    CreateSupportRequestDto:
      type: object
      required:
        - subject
      properties:
        subject:
          type: string
          maxLength: 150
          example: "Kẹt tủ đồ phòng thay đồ nam"
        description:
          type: string
          nullable: true
          example: "Tủ số 12 bị kẹt ổ khóa không mở được"

    UpdateSupportRequestStatusDto:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          example: "in_progress"
        assignedTo:
          type: integer
          format: int64
          nullable: true
          example: 2

    SupportRequestDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        memberName:
          type: string
        assignedTo:
          type: integer
          format: int64
          nullable: true
        assignedToName:
          type: string
          nullable: true
        subject:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    # --- Membership Subscriptions Schemas (SCRUM-71) ---
    SubscriptionDto:
      type: object
      properties:
        id: { type: integer, example: 100 }
        memberId: { type: integer, example: 10 }
        packageId: { type: integer, example: 1 }
        packageName: { type: string, example: "Gói 1 tháng" }
        previousSubscriptionId: { type: integer, nullable: true }
        startDate: { type: string, format: date, example: "2026-10-12" }
        endDate: { type: string, format: date, example: "2026-11-11" }
        status: { type: string, enum: [pending_payment, active, expired, cancelled], example: "active" }
        qrCode: { type: string, nullable: true, example: "QR-SUB-100-XYZ" }
        createdAt: { type: string, format: date-time }

    SubscriptionCreateRequest:
      type: object
      required: [packageId]
      properties:
        packageId: { type: integer, minimum: 1, example: 1 }

    SubscriptionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 201 }
        message: { type: string, example: "Tạo đơn đăng ký gói tập thành công" }
        data: { $ref: '#/components/schemas/SubscriptionDto' }
        timestamp: { type: string, format: date-time }

    SubscriptionNullableResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string, example: "Lấy thông tin gói thành viên hiện tại thành công." }
        data:
          nullable: true
          anyOf:
            - $ref: '#/components/schemas/SubscriptionDto'
            - type: 'null'
        timestamp: { type: string, format: date-time }

    SubscriptionListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string, example: "Lấy danh sách gói thành viên thành công." }
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionDto'
        timestamp: { type: string, format: date-time }

    # --- Scheduling Schemas (SCRUM-72) ---
    GymClassDto:
      type: object
      properties:
        id: { type: integer, example: 5 }
        name: { type: string, example: "Yoga Buổi Sáng" }
        disciplineId: { type: integer, example: 2 }
        disciplineName: { type: string, example: "Yoga" }
        coachId: { type: integer, example: 3 }
        coachName: { type: string, example: "HLV Nam" }
        roomId: { type: integer, example: 1 }
        roomName: { type: string, example: "Phòng Studio 1" }
        capacity: { type: integer, example: 20 }
        level: { type: string, enum: [beginner, intermediate, advanced, all], example: "all" }
        status: { type: string, enum: [active, inactive, archived], example: "active" }

    ClassCreateRequest:
      type: object
      required: [name, disciplineId, coachId, roomId, capacity, level]
      properties:
        name: { type: string, maxLength: 150, example: "Yoga Buổi Sáng" }
        disciplineId: { type: integer, example: 2 }
        coachId: { type: integer, example: 3 }
        roomId: { type: integer, example: 1 }
        capacity: { type: integer, minimum: 1, example: 20 }
        level: { type: string, enum: [beginner, intermediate, advanced, all], example: "all" }

    GymClassResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 201 }
        message: { type: string }
        data: { $ref: '#/components/schemas/GymClassDto' }
        timestamp: { type: string, format: date-time }

    ClassSessionDto:
      type: object
      properties:
        id: { type: integer, example: 12 }
        classId: { type: integer, example: 5 }
        className: { type: string, example: "Yoga Buổi Sáng" }
        sessionDate: { type: string, format: date, example: "2026-10-15" }
        startTime: { type: string, example: "08:00:00" }
        endTime: { type: string, example: "09:30:00" }
        status: { type: string, enum: [scheduled, completed, cancelled], example: "scheduled" }

    SessionScheduleRequest:
      type: object
      required: [sessionDate, startTime, endTime]
      properties:
        sessionDate: { type: string, format: date, example: "2026-10-15" }
        startTime: { type: string, example: "08:00:00" }
        endTime: { type: string, example: "09:30:00" }

    ClassSessionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 201 }
        message: { type: string }
        data: { $ref: '#/components/schemas/ClassSessionDto' }
        timestamp: { type: string, format: date-time }

    ClassSessionListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClassSessionDto'
        timestamp: { type: string, format: date-time }

    # --- Class Enrollments Schemas (SCRUM-73) ---
    EnrollmentDto:
      type: object
      properties:
        id: { type: integer, example: 25 }
        classId: { type: integer, example: 5 }
        className: { type: string, example: "Yoga Buổi Sáng" }
        memberId: { type: integer, example: 10 }
        sessionId: { type: integer, nullable: true, example: 12 }
        sessionDate: { type: string, format: date, nullable: true, example: "2026-10-15" }
        startTime: { type: string, nullable: true, example: "08:00:00" }
        endTime: { type: string, nullable: true, example: "09:30:00" }
        status: { type: string, enum: [booked, cancelled, completed], example: "booked" }
        enrolledAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }

    EnrollmentResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 201 }
        message: { type: string }
        data: { $ref: '#/components/schemas/EnrollmentDto' }
        timestamp: { type: string, format: date-time }

    EnrollmentListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentDto'
        timestamp: { type: string, format: date-time }

    # --- Waitlist Schemas (SCRUM-74) ---
    WaitlistDto:
      type: object
      properties:
        id: { type: integer, example: 3 }
        classId: { type: integer, example: 5 }
        className: { type: string, example: "Yoga Buổi Sáng" }
        memberId: { type: integer, example: 10 }
        status: { type: string, enum: [waiting, notified, expired], example: "waiting" }
        requestedAt: { type: string, format: date-time }

    WaitlistResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 201 }
        message: { type: string }
        data: { $ref: '#/components/schemas/WaitlistDto' }
        timestamp: { type: string, format: date-time }

    WaitlistListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/WaitlistDto'
        timestamp: { type: string, format: date-time }

    # --- Center Check-in Schemas (SCRUM-75) ---
    CheckinDto:
      type: object
      properties:
        id: { type: integer, example: 45 }
        memberId: { type: integer, example: 10 }
        memberName: { type: string, example: "Nguyễn Văn A" }
        membershipCode: { type: string, example: "MB-2026-001" }
        checkInTime: { type: string, format: date-time }
        checkOutTime: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [qr, manual], example: "qr" }
        gate: { type: string, nullable: true, example: "Cổng A" }
        recordedById: { type: integer, nullable: true, example: 1 }
        status: { type: string, enum: [GRANTED, DENIED], example: "GRANTED" }

    CheckinScanRequest:
      type: object
      required: [qrCode]
      properties:
        qrCode: { type: string, example: "QR-SUB-100-XYZ" }
        gate: { type: string, example: "Cổng A" }

    CheckinResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 201 }
        message: { type: string }
        data: { $ref: '#/components/schemas/CheckinDto' }
        timestamp: { type: string, format: date-time }

    CheckinListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/CheckinDto'
        timestamp: { type: string, format: date-time }

security:
  - bearerAuth: []

paths:
  # ==========================================
  # Notifications Endpoints (SCRUM-67)
  # ==========================================
  /notifications:
    get:
      summary: Lấy danh sách thông báo của người dùng hiện tại (phân trang)
      tags: [Notifications]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/NotificationDto'
        '401':
          description: Chưa xác thực (UNAUTHORIZED)

  /notifications/unread-count:
    get:
      summary: Đếm số lượng thông báo chưa đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UnreadCountDto'
        '401':
          description: Chưa xác thực

  /notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
        '404':
          description: Không tìm thấy thông báo

  /notifications/read-all:
    patch:
      summary: Đánh dấu tất cả thông báo của người dùng là đã đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công

  # ==========================================
  # Support Requests Endpoints (SCRUM-68)
  # ==========================================
  /support/requests:
    post:
      summary: Tạo phiếu yêu cầu hỗ trợ / khiếu nại mới (Chỉ MEMBER)
      tags: [Support]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportRequestDto'
      responses:
        '200':
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Dữ liệu không hợp lệ (VALIDATION_ERROR)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

    get:
      summary: Xem toàn bộ danh sách phiếu yêu cầu hỗ trợ (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/my:
    get:
      summary: Lấy lịch sử yêu cầu hỗ trợ của chính hội viên đang đăng nhập (Chỉ MEMBER)
      tags: [Support]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/{id}/status:
    patch:
      summary: Cập nhật trạng thái phiếu hỗ trợ và người phụ trách (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupportRequestStatusDto'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Lỗi state machine chuyển trạng thái hoặc validation (INVALID_STATE_TRANSITION)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)
        '404':
          description: Phiếu hỗ trợ không tồn tại

  # ==========================================
  # SCRUM-71: Membership Subscriptions
  # ==========================================
  /memberships/subscriptions:
    post:
      summary: Create a subscription pending payment (SCRUM-71)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '400':
          description: Bad request or inactive package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Already has active subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /memberships/subscriptions/{id}/renew:
    post:
      summary: Create a renewal pending payment (SCRUM-71)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '403':
          description: Not owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Subscription not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /memberships/subscriptions/my:
    get:
      summary: Get authenticated member's current active subscription (or null if none) with QR code (SCRUM-71)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionNullableResponse' }
  /memberships/subscriptions/history:
    get:
      summary: List authenticated member's subscription history with QR codes (SCRUM-71)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionListResponse' }

  # ==========================================
  # SCRUM-72: Classes & Sessions
  # ==========================================
  /classes:
    post:
      summary: Create gym class (CENTER_MANAGER) (SCRUM-72)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GymClassResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /classes/{id}/sessions:
    post:
      summary: Schedule a class session with trigger P3 conflict check (SCRUM-72)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionScheduleRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSessionResponse' }
        '409':
          description: Schedule conflict (Coach or Room already booked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /classes/sessions:
    get:
      summary: List class sessions with filters (SCRUM-72)
      parameters:
        - name: classId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSessionListResponse' }

  # ==========================================
  # SCRUM-73: Class Enrollments
  # ==========================================
  /classes/sessions/{id}/enroll:
    post:
      summary: Book a seat in a session with trigger P2 & P4 check (MEMBER) (SCRUM-73)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentResponse' }
        '400':
          description: Session cancelled or past due
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Membership expired or inactive (Trigger P4)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Class full (Trigger P2) or already booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /classes/enrollments/{id}:
    delete:
      summary: Cancel booking and release seat (Owner or Staff) (SCRUM-73)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentResponse' }
        '400':
          description: Not booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /classes/enrollments/my:
    get:
      summary: List authenticated member's class enrollments (SCRUM-73)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [booked, cancelled, completed] }
        - name: upcoming
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentListResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (Requires MEMBER role)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ==========================================
  # SCRUM-74: Class Waitlists
  # ==========================================
  /classes/sessions/{id}/waitlist:
    post:
      summary: Join waitlist when class is full (MEMBER) (SCRUM-74)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201':
          description: Joined waitlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistResponse' }
        '400':
          description: Class has space or duplicate waitlist or session not open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Inactive membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /classes/waitlists/{id}:
    delete:
      summary: Withdraw from waitlist (Owner only) (SCRUM-74)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistResponse' }
        '403':
          description: Not owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /classes/waitlists/my:
    get:
      summary: List authenticated member's waitlist entries (SCRUM-74)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitlistListResponse' }

  # ==========================================
  # SCRUM-75: Center QR Check-in
  # ==========================================
  /check-in/scan:
    post:
      summary: Scan QR code at entrance with trigger P4 check (Staff only) (SCRUM-75)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckinScanRequest' }
      responses:
        '201':
          description: Access granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResponse' }
        '403':
          description: Access denied (Trigger P4: Inactive/expired membership or invalid QR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Already checked in and not checked out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /check-in/{id}/checkout:
    post:
      summary: Check out of center (SCRUM-75)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResponse' }
        '400':
          description: Already checked out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /check-in/history:
    get:
      summary: Get today's center check-in history (Staff only) (SCRUM-75)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinListResponse' }
