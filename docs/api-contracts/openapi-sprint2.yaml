openapi: 3.0.3
info:
  title: SCMS API - Sprint 2 Contract (Notifications & Support Requests)
  version: 1.0.0
  description: >
    API contracts for Sprint 2 features:
    - Module I1: In-App Notification Module (SCRUM-67)
    - Module I2: Support Requests / Tickets Module (SCRUM-68)
    All endpoints require Bearer JWT authentication and enforce RBAC via @PreAuthorize.
    Responses are wrapped in the standard ApiResponse payload.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: integer
        message:
          type: string
          description: Localized message (vi/en)
        code:
          type: string
          description: Error code when success is false
        data:
          description: Payload
        details:
          description: Validation or error details
        timestamp:
          type: string
          format: date-time

    # --- Notifications Schemas ---
    NotificationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [schedule_change, package_expiry, class_reminder, system, support_reply, payment]
        relatedEntityType:
          type: string
          nullable: true
        relatedEntityId:
          type: integer
          format: int64
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UnreadCountDto:
      type: object
      properties:
        count:
          type: integer
          format: int64

    # --- Support Requests Schemas ---
    CreateSupportRequestDto:
      type: object
      required:
        - subject
      properties:
        subject:
          type: string
          maxLength: 150
          example: "Kẹt tủ đồ phòng thay đồ nam"
        description:
          type: string
          nullable: true
          example: "Tủ số 12 bị kẹt ổ khóa không mở được"

    UpdateSupportRequestStatusDto:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          example: "in_progress"
        assignedTo:
          type: integer
          format: int64
          nullable: true
          example: 2

    SupportRequestDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        memberName:
          type: string
        assignedTo:
          type: integer
          format: int64
          nullable: true
        assignedToName:
          type: string
          nullable: true
        subject:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

security:
  - bearerAuth: []

paths:
  # ==========================================
  # Notifications Endpoints
  # ==========================================
  /notifications:
    get:
      summary: Lấy danh sách thông báo của người dùng hiện tại (phân trang)
      tags: [Notifications]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/NotificationDto'
        '401':
          description: Chưa xác thực (UNAUTHORIZED)

  /notifications/unread-count:
    get:
      summary: Đếm số lượng thông báo chưa đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UnreadCountDto'
        '401':
          description: Chưa xác thực

  /notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
        '404':
          description: Không tìm thấy thông báo

  /notifications/read-all:
    patch:
      summary: Đánh dấu tất cả thông báo của người dùng là đã đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công

  # ==========================================
  # Support Requests Endpoints
  # ==========================================
  /support/requests:
    post:
      summary: Tạo phiếu yêu cầu hỗ trợ / khiếu nại mới (Chỉ MEMBER)
      tags: [Support]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportRequestDto'
      responses:
        '200':
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Dữ liệu không hợp lệ (VALIDATION_ERROR)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

    get:
      summary: Xem toàn bộ danh sách phiếu yêu cầu hỗ trợ (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/my:
    get:
      summary: Lấy lịch sử yêu cầu hỗ trợ của chính hội viên đang đăng nhập (Chỉ MEMBER)
      tags: [Support]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/{id}/status:
    patch:
      summary: Cập nhật trạng thái phiếu hỗ trợ và người phụ trách (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupportRequestStatusDto'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Lỗi state machine chuyển trạng thái hoặc validation (INVALID_STATE_TRANSITION)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)
        '404':
          description: Phiếu hỗ trợ không tồn tại
