openapi: 3.0.3
info:
  title: SCMS coaching review corrections (SCRUM-133 / SCRUM-134)
  version: 1.0.1
  description: >
    Corrections from review of PR 79, inherited by PR 78. All responses use the existing ApiResponse envelope
    and Accept-Language localization.
    NOTE (Superseded): One-hour slot rules (06:00–20:00) and the coach consecutive-slot rest limit were
    superseded by the 5 fixed schedule slots (07:00–19:30, no coach rest restriction) in
    openapi-group-classes-restored.yaml.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /coach-bookings:
    post:
      summary: Member books a 1:1 PT session (see openapi-group-classes-restored.yaml for current 5-slot rules)
      description: >
        Requires an active, unexpired membership covering today and the booking date for every payment method.
        Current scheduling uses the 5 fixed slots (07:00–19:30, see openapi-group-classes-restored.yaml) and must
        be booked at least two hours ahead; the legacy consecutive-slot coach rest restriction has been removed.
        Rejects overlapping PT or booked group sessions. Paid methods remain pending until the front desk
        confirms payment (POST /coach-bookings/{id}/confirm-payment); package quota uses used_quota. A member
        may hold at most two unpaid hourly sessions, past or upcoming (409 COACH_BOOKING_UNPAID_LIMIT).
        Concurrent bookings by one member are serialized so the monthly quota cannot be exceeded. Database
        triggers enforce concurrent schedule and membership checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coachId, bookingDate, startTime, endTime]
              properties:
                coachId: {type: integer, format: int64}
                disciplineId: {type: integer, format: int64, nullable: true}
                bookingDate: {type: string, format: date}
                startTime: {type: string, example: '14:15:00'}
                endTime: {type: string, example: '16:45:00'}
                paymentMethod: {type: string, enum: [package_quota, cash, bank_transfer, online_wallet], default: package_quota}
                notes: {type: string, nullable: true}
      responses:
        '201': {description: 'ApiResponse containing CoachBookingDto; paymentStatus is pending or used_quota'}
        '400': {description: 'Invalid slot (INVALID_COACH_BOOKING_SLOT), unavailable/held membership, exhausted quota or INVALID_PAYMENT_METHOD'}
        '403': {description: 'Role denied or trigger rejects inactive membership'}
        '409': {description: 'Schedule conflict, COACH_ON_LEAVE, COACH_BOOKING_UNPAID_LIMIT, or SCHEDULE_UPDATE_IN_PROGRESS while a concurrent schedule write holds the guard; client may retry after refreshing'}
  /coach-bookings/unpaid:
    get:
      summary: Hourly PT sessions waiting for payment (RECEPTIONIST, CENTER_MANAGER)
      description: Confirmed or completed sessions whose paymentStatus is pending, oldest first.
      responses:
        '200': {description: 'ApiResponse containing CoachBookingDto[]'}
        '403': {description: 'Role denied'}
  /coach-bookings/{id}/confirm-payment:
    post:
      summary: Front desk records payment for an hourly PT session (RECEPTIONIST, CENTER_MANAGER)
      description: Sets paymentStatus to paid and writes a successful payment of the session's hourlyRate so it appears in revenue reports. method defaults to the booking's payment method.
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
        - {in: query, name: method, schema: {type: string, enum: [cash, bank_transfer, online_wallet]}}
      responses:
        '200': {description: ApiResponse containing CoachBookingDto with paymentStatus paid}
        '400': {description: INVALID_PAYMENT_METHOD}
        '403': {description: Role denied}
        '404': {description: Booking not found}
        '409': {description: COACH_BOOKING_PAYMENT_NOT_PENDING when the session is cancelled, uses package quota or is already paid}
  /coach-bookings/{id}:
    delete:
      summary: Cancel a PT booking
      description: Allowed for its member, its assigned coach or a center manager. An unrelated coach receives HTTP 403.
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
        - {in: query, name: reason, schema: {type: string}}
      responses:
        '200': {description: ApiResponse containing cancelled CoachBookingDto}
        '400': {description: Already cancelled}
        '403': {description: Not authorized for this booking}
        '404': {description: Booking not found}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
