openapi: 3.0.3
info:
  title: SCMS API - Sprint 1 contract
  version: 1.0.0
  description: >
    Endpoint contract for Sprint 1 (auth, users/RBAC, profile, health, catalog, reception lookup).
    All responses use the ApiResponse envelope. Messages are localized via the Accept-Language header (default vi).
    Requests to /auth/** share a per-client limit of 60 per minute; excess requests return HTTP 429
    with code RATE_LIMIT_EXCEEDED and a Retry-After header.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: integer }
        message: { type: string, description: Localized message }
        code: { type: string, description: Error code, present on errors }
        data: { description: Payload }
        details: { description: Field errors for validation failures }
        timestamp: { type: string, format: date-time }
    Discipline:
      type: object
      properties: { id: { type: integer }, name: { type: string }, description: { type: string } }
    Room:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        location: { type: string }
        capacity: { type: integer, minimum: 1 }
        status: { type: string, enum: [available, maintenance, closed] }
        disciplineId: { type: integer, format: int64, nullable: true, description: 'Court discipline; null for ordinary rooms' }
        disciplineName: { type: string, nullable: true, readOnly: true }
        openTime: { type: string, nullable: true, example: '06:00:00', description: 'Required whole hour when disciplineId assigned' }
        closeTime: { type: string, nullable: true, example: '22:00:00', description: 'Whole hour strictly after openTime; no overnight opening' }
    MembershipPackage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number, minimum: 0 }
        durationDays: { type: integer, minimum: 1 }
        classCreditLimit: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, inactive] }
    MemberLookupItem:
      type: object
      properties:
        userId: { type: integer }
        membershipCode: { type: string }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
    UserCreate:
      type: object
      required: [fullName, email, password, roleId, gender]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 150 }
        phone: { type: string, maxLength: 20, nullable: true }
        password: { type: string, minLength: 6, maxLength: 50 }
        roleId: { type: integer, format: int64 }
        gender: { type: string, enum: [male, female, other] }
    UserUpdate:
      type: object
      properties:
        fullName: { type: string, maxLength: 150, nullable: true }
        phone: { type: string, maxLength: 20, nullable: true }
        roleId: { type: integer, format: int64, nullable: true }
        gender: { type: string, enum: [male, female, other], nullable: true }
    StaffAccountCreate:
      type: object
      required: [fullName, email, password, gender, roleCode]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 150 }
        phone: { type: string, maxLength: 20, nullable: true }
        password: { type: string, minLength: 6, maxLength: 50 }
        gender: { type: string, enum: [male, female, other] }
        roleCode: { type: string, enum: [COACH, RECEPTIONIST] }
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login (public). data = { token, username, role }
      security: []
      responses: { '200': { description: OK }, '401': { description: INVALID_CREDENTIALS }, '403': { description: ACCOUNT_INACTIVE } }
  /auth/me:
    get:
      summary: Verify the current session. data = { username, role } where role is the role currently stored in the database
      responses: { '200': { description: OK }, '401': { description: Missing, expired or deactivated session } }
  /auth/register:
    post:
      summary: Register a MEMBER account (public). data = { message, userId, username }
      security: []
      responses: { '201': { description: Created }, '409': { description: USERNAME_EXISTS / EMAIL_EXISTS } }
  /auth/send-otp:
    post:
      summary: Send OTP (public). data = { destination, expiresInMinutes, debugOtp? (debug only) }
      security: []
      responses: { '200': { description: OK }, '503': { description: Delivery channel not configured } }
  /auth/verify-otp:
    post:
      summary: Verify OTP and activate account (public). data = { target, isVerified }
      security: []
      responses: { '200': { description: OK }, '400': { description: OTP_EXPIRED / INVALID_OTP }, '429': { description: MAX_ATTEMPTS } }
  /auth/password/send-otp:
    post:
      summary: Send 6-digit password reset OTP to an existing user's email (public). data = { email, expiresInMinutes, debugOtp? }
      security: []
      responses: { '200': { description: OK }, '400': { description: INVALID_EMAIL / MISSING_EMAIL }, '403': { description: ACCOUNT_INACTIVE }, '404': { description: NOT_FOUND }, '503': { description: Delivery channel not configured } }
  /auth/password/reset:
    post:
      summary: Verify 6-digit OTP and reset account password (public). data = { email }
      security: []
      responses: { '200': { description: OK }, '400': { description: OTP_EXPIRED / INVALID_OTP }, '403': { description: ACCOUNT_INACTIVE }, '404': { description: NOT_FOUND }, '429': { description: MAX_ATTEMPTS } }
  /auth/google/send-otp:
    post:
      summary: Create pending account if needed and send Google login OTP (public). data = { email, message, expiresInMinutes, debugOtp? }
      security: []
      responses: { '200': { description: OK }, '400': { description: INVALID_EMAIL / MISSING_EMAIL }, '403': { description: ACCOUNT_INACTIVE }, '503': { description: Delivery channel not configured } }
  /auth/google/verify-otp:
    post:
      summary: Verify Google OTP, activate account, and issue JWT token (public). data = { token, username, role }
      security: []
      responses: { '200': { description: OK }, '400': { description: OTP_EXPIRED / INVALID_OTP }, '403': { description: ACCOUNT_INACTIVE }, '429': { description: MAX_ATTEMPTS } }
  /auth/google/oauth-callback:
    post:
      summary: Authenticate Google Member or provisioned staff accounts (public)
      description: >
        Accepts an ID token or an access token bound to this application client. Authorization codes are accepted only by the state-protected GET callback.
        Active MEMBER, COACH and RECEPTIONIST accounts receive JWT authentication with their stored database role.
        New Google identities create only MEMBER accounts; new/inactive Members receive activation OTP.
        Inactive staff, Manager, Admin, deleted and locked accounts are rejected.
        Existing Google bindings cannot be replaced. Email linking requires a verified Gmail or Google Workspace identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [idToken]
                - required: [accessToken]
              properties:
                idToken: {type: string, minLength: 1}
                accessToken: {type: string, minLength: 1}
      responses:
        '200':
          description: Active members receive requiresOtp=false and authentication; pending members receive requiresOtp=true and OTP metadata. Debug OTP is never included for authenticated members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        required: [requiresOtp, email, authentication]
                        properties:
                          requiresOtp: {type: boolean, enum: [false]}
                          email: {type: string, format: email}
                          authentication:
                            type: object
                            required: [token, username, role]
                            properties:
                              token: {type: string}
                              username: {type: string}
                              role: {type: string, enum: [MEMBER]}
                      - type: object
                        required: [requiresOtp, email, message, expiresInMinutes]
                        properties:
                          requiresOtp: {type: boolean, enum: [true]}
                          email: {type: string, format: email}
                          message: {type: string}
                          expiresInMinutes: {type: integer, enum: [5]}
                          debugOtp: {type: string, description: Present only when debug OTP is enabled}
        '401': {description: Invalid Google credentials, unverified email or account linking required}
        '403': {description: Staff, deleted or locked account}
        '429': {description: OTP request limit exceeded}
        '503': {description: OTP delivery is not configured}
  /auth/google/authorize:
    get:
      summary: Start Google authorization code redirect (SCRUM-89, public)
      description: Requires GOOGLE_CLIENT_ID. Redirects first to the configured backend authorize/start origin so its session cookie is available at callback. Any redirect_uri must exactly match GOOGLE_REDIRECT_URI.
      security: []
      parameters:
        - name: code_challenge
          in: query
          required: true
          description: Base64url SHA-256 of a random 32-byte browser verifier retained in sessionStorage
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        - name: redirect_uri
          in: query
          schema: {type: string, format: uri}
      responses:
        '302':
          description: Redirect to canonical backend authorize/start, or frontend login with google_oauth=not_configured
          headers:
            Location: {schema: {type: string, format: uri}}
  /auth/google/authorize/start:
    get:
      summary: Establish browser correlation session and redirect to Google (SCRUM-89, public)
      description: Sets an HttpOnly SameSite=Lax session cookie on the backend host and generates single-use state valid for five minutes. JWT authentication remains stateless.
      security: []
      parameters:
        - name: code_challenge
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '302':
          description: Google consent URL including state, or not_configured fallback
          headers:
            Location: {schema: {type: string, format: uri}}
  /auth/google/callback:
    get:
      summary: Exchange Google authorization code and redirect to login completion (SCRUM-89, public)
      description: Requires GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, registered GOOGLE_REDIRECT_URI and the initiating browser session cookie. State is consumed before exchange; missing, expired, mismatched and replayed states are rejected.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: {type: string}
        - name: code
          in: query
          schema: {type: string}
        - name: error
          in: query
          schema: {type: string}
        - name: redirect_uri
          in: query
          schema: {type: string, format: uri}
      responses:
        '302':
          description: Pending members use google_oauth=callback with OTP metadata. Active members use google_oauth=authenticated with a single-use google_login_code URL fragment, valid for 60 seconds and bound to the initiating browser verifier. JWT never appears in the redirect URL. Errors use google_oauth=error. Debug mode alone includes debug_otp.
          headers:
            Location: {schema: {type: string, format: uri}}
  /auth/google/handoff:
    post:
      summary: Complete returning-member redirect authentication (SCRUM-89, public)
      description: Redeems a single-use, 60-second handoff using the initiating browser verifier. Expired, replayed and mismatched-browser handoffs cannot authenticate. Response uses Cache-Control no-store. Pending account activation still uses verify-otp.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code: {type: string, minLength: 43, maxLength: 43}
                verifier: {type: string, minLength: 43, maxLength: 43}
      responses:
        '200': {description: 'data = {token, username, role}'}
        '400': {description: Invalid request fields}
        '401': {description: INVALID_GOOGLE_HANDOFF}
  /auth/google:
    post:
      summary: Authenticate via Google ID Token (SCRUM-89, public). data = { token, username, role }
      description: Requires GOOGLE_CLIENT_ID. Active MEMBER, COACH and RECEPTIONIST accounts may sign in with their stored role. New accounts are always MEMBER. Existing Google bindings cannot be replaced. Linking existing accounts with third-party email requires additional verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: {type: string, minLength: 1}
      security: []
      responses: { '200': { description: OK }, '401': { description: INVALID_GOOGLE_TOKEN / GOOGLE_EMAIL_NOT_VERIFIED / GOOGLE_LOGIN_NOT_CONFIGURED / GOOGLE_ACCOUNT_LINK_REQUIRED }, '403': { description: STAFF_GOOGLE_NOT_ALLOWED / ACCOUNT_INACTIVE } }
  /staff-accounts:
    get:
      summary: List non-deleted Coach and Receptionist accounts (CENTER_MANAGER or ADMIN)
      responses:
        '200': { description: 'ApiResponse.data = UserDto[], restricted to COACH and RECEPTIONIST' }
        '401': { description: Authentication required }
        '403': { description: CENTER_MANAGER or ADMIN required }
    post:
      summary: Provision Coach or Receptionist (CENTER_MANAGER or ADMIN)
      description: Creates an active account and its matching professional profile. Role codes other than COACH and RECEPTIONIST are rejected. Email is normalized and must be unique. A verified Google sign-in using the provisioned email preserves the assigned role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffAccountCreate' }
      responses:
        '201': { description: 'ApiResponse.data = UserDto, without password or password hash' }
        '400': { description: Invalid fields or role code }
        '401': { description: Authentication required }
        '403': { description: CENTER_MANAGER or ADMIN required }
        '409': { description: EMAIL_EXISTS / PHONE_EXISTS }
  /staff-accounts/{id}/lock:
    patch:
      summary: Lock a Coach or Receptionist account (CENTER_MANAGER or ADMIN)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 'ApiResponse.data = UserDto with status locked' }
        '400': { description: INVALID_STAFF_ROLE - target is not a Coach or Receptionist }
        '403': { description: CENTER_MANAGER or ADMIN required }
        '404': { description: User not found or deleted }
  /staff-accounts/{id}/unlock:
    patch:
      summary: Unlock a Coach or Receptionist account (CENTER_MANAGER or ADMIN)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 'ApiResponse.data = UserDto with status active' }
        '400': { description: INVALID_STAFF_ROLE }
        '403': { description: CENTER_MANAGER or ADMIN required }
        '404': { description: User not found or deleted }
  /users:
    get: { summary: List users (non deleted, ADMIN only), responses: { '200': { description: OK }, '403': { description: ADMIN required } } }
    post:
      summary: Create user including Manager accounts (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed, including missing or invalid gender }
        '403': { description: ADMIN role required }
        '409': { description: EMAIL_EXISTS / PHONE_EXISTS }
  /users/cleanup-inactive:
    post:
      summary: Soft-delete users inactive for more than six calendar months (ADMIN)
      description: >-
        Uses lastLoginAt, or createdAt if the user has never logged in.
        Excludes ADMIN and CENTER_MANAGER accounts and users with a frozen subscription.
        The same policy runs daily at 02:00 in the scheduler's configured time zone.
        User list/detail responses include subscriptionFrozen for members (boolean; omitted or null for other roles).
      responses:
        '200':
          description: Cleanup completed; ApiResponse.data.deletedCount is the number of soft-deleted accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [deletedCount]
                    properties:
                      deletedCount: { type: integer, minimum: 0 }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required }
  /users/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    get: { summary: User detail, responses: { '200': { description: OK }, '404': { description: NOT_FOUND } } }
    put:
      summary: Update user (ADMIN, including role changes)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200': { description: OK }
        '400': { description: Validation failed, including invalid gender }
        '403': { description: ADMIN role required }
        '409': { description: "USER_HAS_OPEN_COMMITMENTS when the role changes while a member still holds an active/frozen/unpaid membership or upcoming bookings, or a coach still has upcoming class sessions or 1:1 sessions" }
    delete:
      summary: Soft delete user
      description: Refused while the user has open commitments (same rules as a role change); settle or reassign them first.
      responses:
        '200': { description: OK }
        '409': { description: USER_HAS_OPEN_COMMITMENTS (messageKey users.blocked.membership, users.blocked.bookings, users.blocked.coach_classes or users.blocked.coach_sessions) }
  /users/{id}/lock:
    patch: { summary: Lock account, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: OK } } }
  /users/{id}/unlock:
    patch: { summary: Unlock account, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: OK } } }
  /users/{id}/receptionist:
    put: { summary: Update receptionist profile (ADMIN), parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: OK } } }
  /roles:
    get: { summary: List roles (ADMIN), responses: { '200': { description: OK } } }
  /roles/permissions:
    get: { summary: List permissions (ADMIN), responses: { '200': { description: OK } } }
  /roles/{id}/permissions:
    get: { summary: Permissions of a role, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: OK } } }
  /roles/{id}/permissions/{permissionId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: permissionId, in: path, required: true, schema: { type: integer } }
    put: { summary: Grant permission to role (audited; ADMIN), responses: { '200': { description: OK }, '404': { description: NOT_FOUND } } }
    delete: { summary: Revoke permission from role (audited; ADMIN), responses: { '200': { description: OK } } }
  /profile:
    get:
      summary: Current user profile
      responses:
        '200': { description: 'ApiResponse.data contains the current profile; avatarUrl falls back to /images/default-avatar.png when unset.' }
    put:
      summary: Update current user profile
      description: >-
        Gender accepts male, female or other (case-insensitive; blank clears the optional value).
        Member fitnessLevel accepts beginner, intermediate or advanced (case-insensitive; blank leaves the level unchanged).
        Invalid values return a localized validation error instead of silently clearing or ignoring the field.
      responses:
        '200': { description: Updated profile in ApiResponse.data }
        '400': { description: 'INVALID_GENDER, INVALID_FITNESS_LEVEL or invalid avatar data. Message is localized through Accept-Language.' }
  /profile/avatar:
    post:
      summary: Update or reset the authenticated user's avatar
      description: Changes only the avatar and returns the persisted profile. Null or blank resets to /images/default-avatar.png.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avatarUrl:
                  type: string
                  nullable: true
                  maxLength: 2800000
                  description: 'HTTP(S) or relative URL, or JPEG/PNG/WebP base64 data URL with at most 2 MiB decoded data.'
      responses:
        '200': { description: Updated persisted profile in ApiResponse.data }
        '400': { description: Invalid avatar URL, format or data, or avatar exceeds 2 MiB }
  /profile/password:
    post:
      summary: Change the authenticated user's password and dispatch notification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 6, maxLength: 50 }
      responses:
        '200': { description: Password updated }
        '400': { description: INVALID_CURRENT_PASSWORD / PASSWORD_UNCHANGED }
  /profile/kyc:
    post:
      summary: Verify Member identity (CCCD or Passport) and synchronize fullName before first package purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizenId, fullName, frontImageUrl]
              properties:
                documentType: { type: string, enum: [CCCD, PASSPORT], default: CCCD }
                citizenId: { type: string, maxLength: 30 }
                fullName: { type: string, maxLength: 150 }
                nationality: { type: string }
                frontImageUrl: { type: string }
                backImageUrl: { type: string }
      responses:
        '200': { description: Updated ProfileDto with identityVerified=true and synchronized fullName }
        '400': { description: Invalid document number, foreign-only passport rule, or missing/oversized document image }
  /profile/coach:
    put: { summary: Update coach profile (COACH), responses: { '200': { description: OK }, '403': { description: FORBIDDEN } } }
  /profile/receptionist:
    put: { summary: Update receptionist profile (RECEPTIONIST), responses: { '200': { description: OK }, '403': { description: FORBIDDEN } } }
  /members/{memberId}/health-metrics:
    parameters: [ { name: memberId, in: path, required: true, schema: { type: integer } } ]
    get: { summary: "Health metric history (owner, manager, or a coach who trains the member: training plan, 1:1 session or class enrollment)", responses: { '200': { description: OK }, '403': { description: FORBIDDEN, COACH_MEMBER_NOT_ASSIGNED or HEALTH_INTAKE_REQUIRED } } }
    post: { summary: 'Append measurement (current assigned COACH, CENTER_MANAGER, or scoped RECEPTIONIST; MEMBER cannot write; RECEPTIONIST may append only after personally recording an open GRANTED check-in today)', responses: { '200': { description: OK }, '400': { description: INVALID_METRIC or INVALID_HEALTH_MEASUREMENT }, '403': { description: FORBIDDEN, COACH_MEMBER_NOT_ASSIGNED or HEALTH_INTAKE_REQUIRED } } }
  /members/lookup:
    get:
      summary: Reception member lookup (CENTER_MANAGER, RECEPTIONIST)
      parameters: [ { name: q, in: query, required: true, schema: { type: string, minLength: 2 } } ]
      responses:
        '200': { description: "data = MemberLookupItem[]" }
        '400': { description: Keyword too short }
  /wallet/members/{memberId}:
    get:
      summary: Get a member's SÖL Wallet balance and transactions at reception (RECEPTIONIST, STAFF, CENTER_MANAGER)
      parameters: [ { name: memberId, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: "data = WalletDto" }
  /wallet/members/{memberId}/topup:
    post:
      summary: Credit a member's SÖL Wallet at the reception counter (RECEPTIONIST, STAFF, CENTER_MANAGER)
      parameters: [ { name: memberId, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 10000, maximum: 100000000 }
                paymentMethod: { type: string, enum: [cash, bank_transfer, pos], default: cash }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: "data = WalletDto" }
        '400': { description: INVALID_TOPUP_AMOUNT }
  /disciplines:
    get: { summary: List disciplines (any authenticated user), responses: { '200': { description: "data = Discipline[]" } } }
    post: { summary: Create discipline (CENTER_MANAGER), responses: { '201': { description: Created }, '409': { description: Name exists } } }
  /disciplines/{id}:
    put: { summary: Update discipline (CENTER_MANAGER), parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: OK } } }
    delete: { summary: "Delete a discipline no class/room/1:1 booking uses; member favourites are cleared (CENTER_MANAGER)", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: Deleted }, '404': { description: Not found }, '409': { description: DISCIPLINE_IN_USE } } }
  /rooms:
    get: { summary: List rooms, responses: { '200': { description: "data = Room[]" } } }
    post: { summary: Create room (CENTER_MANAGER), responses: { '201': { description: Created } } }
  /rooms/{id}:
    put: { summary: Update room incl. status (CENTER_MANAGER), parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: OK } } }
    delete: { summary: "Delete a room never used by a class or court booking; otherwise set status closed (CENTER_MANAGER)", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: Deleted }, '404': { description: Not found }, '409': { description: ROOM_IN_USE } } }
  /packages:
    get: { summary: List membership packages, responses: { '200': { description: "data = MembershipPackage[]" } } }
    post: { summary: Create package (audited; CENTER_MANAGER), responses: { '201': { description: Created } } }
  /packages/{id}:
    put: { summary: Update package (audited; CENTER_MANAGER), parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: OK } } }
    delete: { summary: "Delete a package never sold; otherwise set status inactive (audited; CENTER_MANAGER)", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: Deleted }, '404': { description: Not found }, '409': { description: PACKAGE_IN_USE } } }
