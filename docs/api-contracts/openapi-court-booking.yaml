openapi: 3.0.3
info:
  title: SCMS court booking
  version: 1.0.0
  description: >
    Tennis, badminton and swimming lane reservations. Each plan includes some bookings per calendar month, shared across
    the three court types (SILVER 1, GOLD 2, PLATINUM 3). Any booking beyond that is paid when it is made: 100,000 VND per
    one-hour slot, 125,000 VND for slots starting at 18:00 or later (lighting included). A paid booking writes a successful
    payment (online_wallet or bank_transfer) and needs paymentMethod; without it the API answers
    COURT_BOOKING_PAYMENT_REQUIRED (400).
    All responses use ApiResponse and Accept-Language (vi by default).
    Dates/times use Asia/Ho_Chi_Minh. Book from today through today+7 inclusive,
    at whole hours for 60 minutes within the configured room opening hours.
    Maximum four booked reservations per member per day; one currently active
    subscription must cover today and the reservation date.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /courts:
    get:
      description: Available configured courts. MEMBER, RECEPTIONIST, STAFF or CENTER_MANAGER.
      parameters:
        - {name: discipline, in: query, schema: {type: string}, description: 'Exact discipline name, case insensitive'}
      responses:
        '200':
          description: Courts; empty array if none configured
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Court'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /courts/{roomId}/availability:
    get:
      description: Anonymous slot statuses; never returns member identities. Same roles as court list.
      parameters:
        - {$ref: '#/components/parameters/RoomId'}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Whole-hour slots in room opening hours
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Slot'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /court-bookings:
    post:
      description: MEMBER only. Authenticated member is the booking owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, date, startTime]
              properties:
                roomId: {type: integer, format: int64}
                date: {type: string, format: date}
                startTime: {type: string, example: '12:00:00'}
                paymentMethod: {type: string, enum: [online_wallet, bank_transfer], description: Required only when the plan no longer covers the booking; ignored while it does}
      responses:
        '201': {$ref: '#/components/responses/Booking'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      description: Daily booking list. RECEPTIONIST, STAFF or CENTER_MANAGER only. Excludes soft-deleted members.
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: roomId, in: query, schema: {type: integer, format: int64}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/BookingPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /court-bookings/recurring:
    post:
      summary: Standing court booking for a week or a month (MEMBER)
      description: >
        Books the same one-hour slot on the chosen ISO weekdays (1 = Monday ... 7 = Sunday; defaults to the weekday of
        startDate). period week covers 7 days from startDate, month covers one calendar month. Standing bookings may
        reach 31 days ahead instead of 7. Every date is checked on its own (court overlap, class overlap, member
        overlap, 4 bookings per day, membership covering that date); dates that fail are returned in skipped and the
        rest are kept. Status 201 when at least one booking was created, 200 when none was.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, startDate, startTime, period]
              properties:
                roomId: { type: integer, format: int64 }
                startDate: { type: string, format: date }
                startTime: { type: string, example: '18:00:00' }
                period: { type: string, enum: [week, month] }
                daysOfWeek: { type: array, maxItems: 7, items: { type: integer, minimum: 1, maximum: 7 } }
                paymentMethod: { type: string, enum: [online_wallet, bank_transfer], description: 'Dates are covered by the plan first, then charged; without a method the dates beyond the quota are skipped with COURT_BOOKING_PAYMENT_REQUIRED' }
      responses:
        '201':
          description: At least one booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      booked: { type: array, items: { type: object } }
                    skipped:
                      type: array
                      description: Dates that could not be booked, each with the API error code and a localised reason
                      items:
                        type: object
                        properties:
                          date: { type: string, format: date }
                          code: { type: string }
                          message: { type: string }
        '200': { description: 'No date could be booked; data.skipped explains each one' }
        '400': { description: Invalid period, weekdays, court or time }
        '403': { description: MEMBER required }
        '409': { description: COURT_BOOKING_COURT_UNAVAILABLE }
  /court-bookings/quota:
    get:
      summary: Court bookings still included in the member's plan (MEMBER)
      parameters:
        - {name: date, in: query, schema: {type: string, format: date}, description: 'Month to evaluate; defaults to today'}
      responses:
        '200':
          description: Plan, monthly quota, used and remaining
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - properties:
                      data:
                        type: object
                        properties:
                          packageName: {type: string, nullable: true}
                          monthlyQuota: {type: integer}
                          used: {type: integer}
                          remaining: {type: integer}
        '403': {$ref: '#/components/responses/Forbidden'}
  /court-bookings/my:
    get:
      description: MEMBER only. Own bookings, newest date first, including cancelled/past reservations.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/BookingPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /court-bookings/{id}/cancel:
    patch:
      description: >
        MEMBER owner may cancel at least two hours before start (boundary inclusive).
        RECEPTIONIST, STAFF and CENTER_MANAGER may cancel any future reservation.
        Repeated cancellation is idempotent after ownership authorization.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 255, nullable: true}
      responses:
        '200': {$ref: '#/components/responses/Booking'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    RoomId: {name: roomId, in: path, required: true, schema: {type: integer, format: int64}}
    Page: {name: page, in: query, schema: {type: integer, default: 0, minimum: 0}}
    Size: {name: size, in: query, schema: {type: integer, default: 20, minimum: 1, maximum: 100}}
  schemas:
    ApiResponse:
      type: object
      properties:
        success: {type: boolean}
        status: {type: integer}
        message: {type: string}
        code: {type: string}
        data: {}
        details: {}
        timestamp: {type: string, format: date-time}
    Court:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        location: {type: string, nullable: true}
        disciplineId: {type: integer, format: int64}
        disciplineName: {type: string, enum: [Tennis, Cầu lông, Bơi lội]}
        openTime: {type: string, example: '06:00:00'}
        closeTime: {type: string, example: '22:00:00'}
    Slot:
      type: object
      properties:
        startTime: {type: string}
        endTime: {type: string}
        status: {type: string, enum: [free, booked, class, past]}
        price: {type: number, description: 'Fee for the slot if it is not covered by the plan: 100000, or 125000 from 18:00'}
    Booking:
      type: object
      properties:
        id: {type: integer, format: int64}
        roomId: {type: integer, format: int64}
        roomName: {type: string}
        disciplineName: {type: string, nullable: true}
        memberId: {type: integer, format: int64}
        memberName: {type: string}
        date: {type: string, format: date}
        startTime: {type: string}
        endTime: {type: string}
        status: {type: string, enum: [booked, cancelled]}
        createdAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time, nullable: true}
        cancelReason: {type: string, nullable: true}
        canCancel: {type: boolean, description: Calculated for authenticated actor and current time}
        price: {type: number, description: 'Amount charged; 0 when covered by the plan'}
        paymentMethod: {type: string, nullable: true, description: 'package_quota, online_wallet or bank_transfer'}
        paymentStatus: {type: string, nullable: true, enum: [covered, paid]}
    BookingPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Booking'}}
        totalElements: {type: integer}
        totalPages: {type: integer}
        number: {type: integer}
        size: {type: integer}
        first: {type: boolean}
        last: {type: boolean}
  responses:
    Booking:
      description: Reservation
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ApiResponse'}
              - properties:
                  data: {$ref: '#/components/schemas/Booking'}
    BookingPage:
      description: Paginated reservations
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ApiResponse'}
              - properties:
                  data: {$ref: '#/components/schemas/BookingPage'}
    BadRequest:
      description: 'COURT_BOOKING_PAST_SLOT, TOO_FAR, INVALID_SLOT, INVALID_COURT, PAYMENT_REQUIRED, INVALID_PAYMENT_METHOD or CANCEL_TOO_LATE (all prefixed COURT_BOOKING_); invalid input also uses shared validation errors'
    Forbidden:
      description: 'COURT_BOOKING_MEMBERSHIP_INVALID, COURT_BOOKING_FORBIDDEN or role denied'
    NotFound:
      description: COURT_BOOKING_NOT_FOUND
    Conflict:
      description: 'COURT_BOOKING_SLOT_TAKEN, COURT_BOOKING_LIMIT_REACHED or COURT_BOOKING_COURT_UNAVAILABLE'
