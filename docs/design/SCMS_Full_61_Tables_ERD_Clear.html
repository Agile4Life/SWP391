      position: fixed;

      background: #FFFFFF;

      gap: 12px;

      background: #E67E22;
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn:hover { background: #D35400; }
    .btn-dark { background: #2C3E50; }
    .btn-dark:hover { background: #1A252F; }
    .btn-outline {
      background: #FFFFFF;
      color: #2C3E50;
      border: 1px solid #BDC3C7;
    }
    .btn-outline:hover { background: #F8FAFC; }
    #wrapper {
      padding: 85px 40px 40px 40px;
      display: flex;
      justify-content: center;
      overflow: auto;
    }
    #svg-card {
      background: #FFFFFF;
      box-shadow: 0 4px 30px rgba(0,0,0,0.06);
      border-radius: 8px;
      padding: 24px;
    }
  </style>
</head>
