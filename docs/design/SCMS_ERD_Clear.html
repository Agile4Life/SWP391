<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SCMS ERD Diagram - High Resolution</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      background: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #control-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
      background: #FFFFFF;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      background: #E67E22;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #D35400; }
    .btn-svg { background: #2C3E50; }
    .btn-svg:hover { background: #1A252F; }
    #wrapper {
      padding: 80px 40px 40px 40px;
      display: flex;
      justify-content: center;
    }
    #svg-card {
      background: #FFFFFF;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 20px;
    }
    /* SVG Styling */
    .tbl-header { fill: #E67E22; }
    .tbl-header-txt { fill: #FFFFFF; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; }
    .tbl-body { fill: #FFFDF9; stroke: #E67E22; stroke-width: 1.5; }
    .tbl-row-alt { fill: #FFF7ED; }
    .txt-field { fill: #2C3E50; font-size: 12px; font-family: "JetBrains Mono", Consolas, monospace; }
    .txt-pk { fill: #B45309; font-weight: 700; font-size: 11px; }
    .txt-fk { fill: #C026D3; font-weight: 600; font-size: 11px; }
    .conn-line { stroke: #4B5563; stroke-width: 1.5; fill: none; }
    .conn-label { fill: #6B7280; font-size: 11px; font-style: italic; background: #FFFFFF; }
  </style>
</head>
<body>

  <div id="control-panel">
    <strong style="color: #2C3E50; font-size: 15px;">SCMS ERD Diagram</strong>
    <button class="btn" onclick="downloadHighResPNG()">Tải ảnh PNG Nét Căng (4K)</button>
    <button class="btn btn-svg" onclick="downloadVectorSVG()">Tải ảnh Vector (.SVG)</button>
    <small style="color: #6B7280;">Dán vào Word đảm bảo to rõ 100%</small>
  </div>

    <div id="svg-card">

            <line x1="0" y1="12" x2="10" y2="7" stroke="#4B5563" stroke-width="1.8"/>
            <line x1="0" y1="7" x2="10" y2="7" stroke="#4B5563" stroke-width="1.8"/>
          </marker>
          <marker id="bar" markerWidth="10" markerHeight="14" refX="5" refY="7" orient="auto">

        <!-- BACKGROUND RECT FOR CLEAN EXPORT -->
        <rect width="1350" height="960" fill="#FFFFFF"/>

        <!-- ================= RELATIONSHIP CONNECTOR LINES ================= -->
        <!-- Role -> User -->
        <path d="M 685 110 L 685 160" class="conn-line" marker-start="url(#bar)" marker-end="url(#crow)"/>
        <text x="695" y="140" class="conn-label">assigned_to</text>

        <!-- User -> Members -->
        <path d="M 590 200 L 190 200 L 190 520" class="conn-line" marker-start="url(#bar)" marker-end="url(#bar)"/>

        <!-- User -> Coaches -->

  <script>
    function downloadHighResPNG() {
      const svg = document.getElementById("erd-svg");
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement("canvas");
      // Scale 3x để đạt chuẩn 4K siêu nét
      canvas.width = 1350 * 3;
      canvas.height = 960 * 3;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const img = new Image();
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        const pngUrl = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = pngUrl;
        a.download = "SCMS_ERD_UltraHD.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = url;
    }

    function downloadVectorSVG() {
      const svg = document.getElementById("erd-svg");
      const svgData = new XMLSerializer().serializeToString(svg);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "SCMS_ERD_Vector.svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
