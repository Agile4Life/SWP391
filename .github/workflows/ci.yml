name: Sport Center Project (CI included) | © 2026 by Agile4Life

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify Render deployment script offline
        working-directory: .
        run: python3 -B -m unittest discover -s scripts -p test_deploy_render.py
      - name: Verify Supabase runner configuration
        shell: pwsh
        working-directory: .
        run: ./scripts/test-database-config.ps1
      # Database integration tests run only when SCMS_POSTGRES_TEST_URL is set.
      - name: Verify database policy and backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test
