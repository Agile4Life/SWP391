name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        id: install
        run: npm ci
      # Run every check even if an earlier check failed, while keeping the job red.
      - name: ESLint (no warnings)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Vitest tests and JUnit report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: TypeScript checks and production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Upload frontend test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frontend build
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend tests, PostgreSQL integration and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Disposable PostgreSQL for tests; no Supabase credentials or remote DB access.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scms_test
          POSTGRES_USER: scms_test
          POSTGRES_PASSWORD: scms_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scms_test -d scms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # These variables enable both existing PostgreSQL suites instead of skipping them.
      SCMS_POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/scms_test
      SCMS_POSTGRES_TEST_USERNAME: scms_test
      SCMS_POSTGRES_TEST_PASSWORD: scms_ci_only
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Compile, run all tests and package executable JAR
        run: bash ./mvnw --batch-mode --no-transfer-progress -DfailIfNoTests=true clean verify
      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload backend build
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: apps/api/target/*.jar
          if-no-files-found: error
          retention-days: 7

  playwright:
    name: Playwright browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      # Playwright starts a production preview; API responses are mocked in the suite.
      - name: Run browser integration tests
        run: npm run test:e2e
      - name: Upload Playwright report and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  scripts:
    name: Database runner configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test database profile and JDBC URL validation
        shell: pwsh
        run: ./scripts/test-database-config.ps1

  # Select "CI passed" as a required status check in GitHub branch protection.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [frontend, backend, playwright, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize and require every check to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
        run: |
          printf '| Check | Result |\n| --- | --- |\n| Frontend | %s |\n| Backend + PostgreSQL | %s |\n| Playwright | %s |\n| Database scripts | %s |\n' \
            "$FRONTEND_RESULT" "$BACKEND_RESULT" "$PLAYWRIGHT_RESULT" "$SCRIPTS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FRONTEND_RESULT" != "success" || "$BACKEND_RESULT" != "success" || "$PLAYWRIGHT_RESULT" != "success" || "$SCRIPTS_RESULT" != "success" ]]; then
            echo 'CI failed: all checks must succeed, including any skipped or cancelled jobs.'
            exit 1
          fi
