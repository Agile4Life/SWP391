# PIPELINE: CI và CD cho VPS trong MỘT workflow, một màn hình, một đồ thị job.
#
#   push vào main ─► test-web (frontend)          ─┐
#                    test-api (backend unit)      ─┼─► VPS (SSH pull GHCR, rollback tự động)
#                    test-api-postgres (PG 16 IT) ─┤
#                    images (api + web, push GHCR)─┘
#
# - VPS (Docker Compose): cần test xanh VÀ build+push image GHCR xanh; SSH vào VPS, `git merge --ff-only`,
#   `docker compose pull` + `docker compose up -d --no-build --wait`, health check, lỗi thì rollback image/commit cũ. Thiếu secret VPS_* thì tự bỏ qua.
# - PR và nhánh develop: chỉ chạy test + build kiểm tra image, KHÔNG push GHCR và KHÔNG deploy. Chỉ main (push hoặc chạy tay) mới push và deploy.
# - Bấm "Run workflow" để chạy lại commit mới nhất của main hoặc một commit chỉ định (ô "ref").
# - Tên các job test/build giữ nguyên như trước (Frontend test, lint and build / Backend compile and test /
#   Build and check <api|web> image) để Ruleset đang yêu cầu các check này vẫn khớp.
# Hướng dẫn secrets/variables: docs/DOCKER_COMPOSE.md (VPS).
# MẪU: dự án khác sửa thư mục apps/web, apps/api, nhánh ở `on.push.branches`, phiên bản Node/Java.
name: CI/CD VPS

on:
  pull_request:            # mở/cập nhật PR
  push:
    branches: [main, develop]
  workflow_dispatch:       # chạy tay trong tab Actions
    inputs:
      ref:
        description: Commit SHA cần chạy và deploy (để trống = đầu nhánh được chọn)
        required: false
        default: ''

permissions:
  contents: read

# PR mới hủy lần chạy cũ của PR đó. Trên main không hủy giữa chừng để không cắt ngang lúc deploy.
concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mã commit mà job deploy dùng: commit đang chạy, hoặc commit nhập tay.
  COMMIT: ${{ inputs.ref || github.sha }}

jobs:
  # ---------- Kiểm tra ----------
  # Job 1: giao diện React
  test-web:
    name: Frontend test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web                       # <-- thư mục frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}   # đúng commit đang kiểm tra
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json   # <-- thư mục frontend
      - run: npm ci                                       # cài thư viện đúng theo package-lock
      - run: npm test                                     # test là bắt buộc trong repo này
        env:
          CI: true                                        # để Jest/Vitest không chạy chế độ watch
      - run: npm run lint
      - run: npm run build                                # build lỗi nghĩa là không deploy được


  # Job 2: API Spring Boot
  test-api:
    name: Backend compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api                       # <-- thư mục backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml         # <-- thư mục backend
      # Chính sách database là kiểm tra bắt buộc của dự án.
      - name: Verify Supabase runner configuration
        shell: pwsh
        working-directory: .
        run: ./scripts/test-database-config.ps1
      # Dùng Maven Wrapper đã được version control để build nhất quán.
      - name: Compile and run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  # Job 2b: Kiểm thử tích hợp trên PostgreSQL 16 thật (TLS + cluster biệt lập điểm danh PT)
  test-api-postgres:
    name: Backend PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api                       # <-- thư mục backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml         # <-- thư mục backend
      - name: Start ephemeral PostgreSQL 16 test databases (TLS + isolated PT cluster)
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          cert_dir="$RUNNER_TEMP/pg-ssl"
          mkdir -p "$cert_dir"
          openssl req -new -x509 -days 1 -nodes \
            -out "$cert_dir/server.crt" \
            -keyout "$cert_dir/server.key" \
            -subj "/CN=localhost"
          chmod 644 "$cert_dir/server.crt" "$cert_dir/server.key"

          # Container 1: PostgreSQL 16 bật TLS (DB_SSL_MODE=require) cho toàn bộ suite @ActiveProfiles("supabase").
          docker run -d --name scms-pg-tls \
            -p 127.0.0.1:55431:5432 \
            -v "$cert_dir:/certs:ro" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=scms_ci_test_password \
            -e POSTGRES_DB=postgres \
            -e TZ=Asia/Ho_Chi_Minh \
            --entrypoint sh \
            postgres:16 -c '
              set -eu
              mkdir -p /var/lib/postgresql/ssl
              cp /certs/server.crt /certs/server.key /var/lib/postgresql/ssl/
              chown -R postgres:postgres /var/lib/postgresql/ssl
              chmod 600 /var/lib/postgresql/ssl/server.key
              chmod 644 /var/lib/postgresql/ssl/server.crt
              exec docker-entrypoint.sh postgres \
                -c ssl=on \
                -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt \
                -c ssl_key_file=/var/lib/postgresql/ssl/server.key \
                -c timezone=Asia/Ho_Chi_Minh \
                -c max_connections=100
            '

          # Container 2: Cluster loopback biệt lập (127.0.0.1:55432, nhãn scms_pt_isolated) cho PtAttendanceIsolatedPostgreSqlTest.
          docker run -d --name scms-pg-pt-isolated \
            --network host \
            -e POSTGRES_USER=pt_test \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e TZ=Asia/Ho_Chi_Minh \
            postgres:16 \
            -c port=55432 \
            -c listen_addresses=127.0.0.1 \
            -c cluster_name=scms_pt_isolated \
            -c timezone=Asia/Ho_Chi_Minh

          for i in $(seq 1 30); do
            if docker exec -e PGPASSWORD=scms_ci_test_password scms-pg-tls \
              psql "host=127.0.0.1 port=5432 user=postgres dbname=postgres sslmode=require" -tAc "select 1" 2>/dev/null | grep -qx '1'; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::PostgreSQL TLS test container failed to become ready"
              docker logs scms-pg-tls || true
              exit 1
            fi
            sleep 1
          done
          # Tạo role không bỏ qua RLS để kiểm thử RLS với role anon thực thi đầy đủ.
          docker exec scms-pg-tls psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN NOBYPASSRLS;"

          for i in $(seq 1 30); do
            if docker exec scms-pg-pt-isolated \
              psql -h 127.0.0.1 -p 55432 -U pt_test -d postgres -tAc "select current_setting('cluster_name') || ':' || host(inet_server_addr())" 2>/dev/null | grep -qx 'scms_pt_isolated:127.0.0.1'; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Isolated PT PostgreSQL container failed to become ready"
              docker logs scms-pg-pt-isolated || true
              exit 1
            fi
            sleep 1
          done
      - name: Run PostgreSQL integration tests
        env:
          SCMS_POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:55431/postgres
          SCMS_POSTGRES_TEST_USERNAME: postgres
          SCMS_POSTGRES_TEST_PASSWORD: scms_ci_test_password
          DB_SSL_MODE: require
          TZ: Asia/Ho_Chi_Minh
        run: >-
          ./mvnw --batch-mode --no-transfer-progress test
          -Dtest="*PostgreSql*"
          -DfailIfNoTests=true
          -Dscms.pt.isolated.port=55432
      - name: Show PostgreSQL container logs on failure
        if: failure()
        shell: bash
        working-directory: .
        run: |
          docker logs --tail=60 scms-pg-tls || true
          docker logs --tail=60 scms-pg-pt-isolated || true
      - name: Cleanup PostgreSQL test containers
        if: always()
        shell: bash
        working-directory: .
        run: |
          docker rm -f scms-pg-tls scms-pg-pt-isolated >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/pg-ssl" || true

  # ---------- Build và push image Docker lên GHCR (cho VPS) ----------
  images:
    name: Build and check ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate Compose with dummy settings
        if: matrix.service == 'api'
        run: |
          set -euo pipefail
          compose_dir=$(mktemp -d)
          trap 'rm -rf -- "$compose_dir"' EXIT
          printf 'SPRING_DATASOURCE_URL=jdbc:postgresql://example.invalid:5432/postgres\nSPRING_DATASOURCE_USERNAME=test\nSPRING_DATASOURCE_PASSWORD=test-only\nAPP_JWT_SECRET=test-only\n' > "$compose_dir/.env"
          docker compose --project-directory "$compose_dir" \
            -f "$GITHUB_WORKSPACE/compose.yml" config --quiet
      - name: Warn if VITE_GOOGLE_CLIENT_ID variable is empty on main
        if: >-
          matrix.service == 'web' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::Repository Variable VITE_GOOGLE_CLIENT_ID đang trống; image web sẽ build không kèm Google Client ID."
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: scms-${{ matrix.service }}:ci
          cache-from: type=gha,scope=scms-${{ matrix.service }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=scms-{0}', matrix.service) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Check Java runtime and healthcheck tool
        if: matrix.service == 'api'
        run: docker run --rm --entrypoint sh scms-api:ci -c 'java -version && command -v wget'
      - name: Check Nginx config and React routes
        if: matrix.service == 'web'
        run: |
          set -euo pipefail
          docker run --rm scms-web:ci nginx -t
          docker run -d --name scms-web-check scms-web:ci
          trap 'docker rm -f scms-web-check >/dev/null' EXIT
          for _ in $(seq 1 15); do
            if docker exec scms-web-check wget -q -O /dev/null http://127.0.0.1/index.html; then
              docker exec scms-web-check wget -qO- http://127.0.0.1/login | grep -q 'id="root"'
              exit 0
            fi
            sleep 1
          done
          docker logs scms-web-check
          exit 1
      # Chỉ push lên GHCR sau khi smoke check đã qua và đang chạy trên main.
      - name: Push ${{ matrix.service }} image to GHCR
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ matrix.service }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          resolved_sha=$(git rev-parse HEAD)
          repo_lc=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo_lc}/${SERVICE}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag "scms-${SERVICE}:ci" "${image}:sha-${resolved_sha}"
          docker push "${image}:sha-${resolved_sha}"
          if [ -z "$INPUT_REF" ]; then
            docker tag "scms-${SERVICE}:ci" "${image}:latest"
            docker push "${image}:latest"
          fi

  # ---------- VPS (Docker Compose): pull image từ GHCR qua SSH, rollback tự động ----------
  deploy-vps:
    name: Deploy to VPS over SSH
    needs: [images, test-web, test-api, test-api-postgres]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: read
    # Chỉ một lần deploy lên VPS tại một thời điểm; lần mới đợi lần đang chạy xong.
    concurrency:
      group: vps-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      # Thư mục repo trên VPS (nơi có compose.yml và .env). Đổi bằng Variable VPS_APP_DIR.
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/scms' }}
    steps:
      - name: Check VPS secrets
        id: cfg
        shell: bash
        run: |
          missing=""
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Chưa cấu hình secret:$missing. Bỏ qua deploy VPS."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.cfg.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          # Ghim host key của VPS (từ secret) để tránh bị giả mạo máy chủ; không dùng StrictHostKeyChecking=no.
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy on VPS (pull GHCR images, with rollback)
        if: steps.cfg.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          repo_lc=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image_prefix="ghcr.io/${repo_lc}"
          ssh_opts=(-i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20)

          # Đăng nhập GHCR trên VPS bằng GITHUB_TOKEN ngắn hạn qua stdin (không lộ trong ps/log)
          # và luôn đăng xuất khi kết thúc bước này.
          cleanup_ghcr() {
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true' || true
          }
          trap cleanup_ghcr EXIT
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # Script chạy trên VPS qua stdin; tham số: $1 = commit, $2 = thư mục app, $3 = prefix image GHCR.
          # tee giữ lại toàn bộ log trong deploy.log để bước tóm tắt bên dưới dùng khi lỗi.
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            bash -s -- "$COMMIT" "$VPS_APP_DIR" "$image_prefix" 2>&1 <<'REMOTE' | tee "$RUNNER_TEMP/deploy.log"
          set -euo pipefail
          commit=$1
          dir=$2
          image_prefix=$3
          # Lệnh nào lỗi bất ngờ thì báo rõ dòng và lệnh đó (thông báo gốc của lệnh nằm ngay phía trên).
          trap 'echo "::error::Lệnh bị lỗi (dòng $LINENO): $BASH_COMMAND"' ERR

          # Kiểm tra môi trường trước, lỗi thì nói rõ cách sửa thay vì để git/docker báo lỗi khó hiểu.
          preflight_fail() { echo "::error::$1"; echo "Cách sửa: $2"; exit 1; }
          [ -d "$dir/.git" ] || preflight_fail "Không thấy repo git tại $dir trên VPS" "clone repo vào đó hoặc đặt Variable VPS_APP_DIR đúng đường dẫn"
          cd "$dir"
          [ -f compose.yml ] || preflight_fail "Không có compose.yml trong $dir" "kiểm tra lại VPS_APP_DIR"
          [ -f .env ] || preflight_fail "Thiếu file .env trong $dir" "tạo từ compose.env.example theo docs/DOCKER_COMPOSE.md"
          [ -w .git/objects ] || preflight_fail "User $(id -un) không có quyền ghi vào $dir/.git (owner: $(stat -c %U .git))" "sudo chown -R $(id -un):$(id -gn) $dir"
          docker info >/dev/null 2>&1 || preflight_fail "User $(id -un) không dùng được docker" "sudo usermod -aG docker $(id -un) rồi đăng nhập lại"
          docker compose version >/dev/null 2>&1 || preflight_fail "Chưa cài plugin Docker Compose v2" "cài docker-compose-plugin"
          echo "Còn trống $(df -h --output=avail "$dir" | tail -1 | tr -d ' ') ổ đĩa tại $dir"

          # Không ghi đè thay đổi tay trên VPS: có file đã theo dõi bị sửa thì dừng để người quản trị xử lý.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Repo trên VPS có thay đổi chưa commit, dừng deploy"
            git status --short --untracked-files=no
            exit 1
          fi

          prev=$(git rev-parse HEAD)
          api_cid=$(docker compose ps -aq api 2>/dev/null | head -n 1 || true)
          web_cid=$(docker compose ps -aq web 2>/dev/null | head -n 1 || true)
          prev_api_img=""
          prev_web_img=""
          [ -n "$api_cid" ] && prev_api_img=$(docker inspect --format '{{.Config.Image}}' "$api_cid" 2>/dev/null || true)
          [ -n "$web_cid" ] && prev_web_img=$(docker inspect --format '{{.Config.Image}}' "$web_cid" 2>/dev/null || true)

          # Chỉ fetch nhánh main (và commit chỉ định nếu chạy tay), không kéo ref các nhánh feature/chore khác.
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${commit}^{commit}" 2>/dev/null || git fetch --no-tags origin "$commit"
          target_sha=$(git rev-parse "${commit}^{commit}")
          echo "Commit đang chạy: ${prev:0:7}; commit cần deploy: ${target_sha:0:7}"
          # Chỉ tiến lên (fast-forward). Nếu VPS đã ở commit mới hơn thì bỏ qua, tránh deploy lùi khi hai lần chạy chồng nhau.
          if [ "$target_sha" != "$prev" ] && git merge-base --is-ancestor "$target_sha" "$prev"; then
            echo "VPS đang ở commit mới hơn (${prev:0:7}), bỏ qua để tránh deploy lùi."
            exit 0
          fi
          git merge --ff-only "$target_sha"

          # Pull image đã build sẵn từ GHCR, thay container (--no-build: không bao giờ build trên VPS)
          # và đợi healthcheck của api + web (tối đa 5 phút), rồi gọi thử API qua Nginx.
          # Không dùng `docker compose down`: nó xóa mạng và làm mất kết nối tới container PostgreSQL 1Panel.
          deploy_images() {
            local api_img=$1
            local web_img=$2
            local should_pull=${3:-true}
            export API_IMAGE="$api_img"
            export WEB_IMAGE="$web_img"
            docker compose config --quiet &&
            { [ "$should_pull" != "true" ] || docker compose pull api web; } &&
            docker compose up -d --no-build --remove-orphans --wait --wait-timeout 300 &&
            docker compose exec -T web wget -q -O /dev/null http://127.0.0.1/api/v1/health
          }

          new_api_img="${image_prefix}/api:sha-${target_sha}"
          new_web_img="${image_prefix}/web:sha-${target_sha}"
          echo "Pull và deploy image từ GHCR: $new_api_img và $new_web_img"

          if deploy_images "$new_api_img" "$new_web_img" true; then
            # Cập nhật tag local dự phòng (không tốn thêm ổ đĩa) nếu sau này chạy tay `docker compose up -d`.
            docker tag "$new_api_img" scms-api:local || true
            docker tag "$new_web_img" scms-web:local || true
            docker compose ps
            # Dọn image cũ không còn dùng (giữ lại image trong 7 ngày gần nhất để rollback nhanh).
            docker image prune -af --filter "until=168h" >/dev/null || true
            echo "Deploy thành công commit $(git rev-parse --short HEAD)"
            exit 0
          fi

          echo "::error::Bản mới không khỏe (pull lỗi hoặc container không qua healthcheck). Trạng thái và log gần nhất:"
          docker compose ps -a || true
          docker compose logs --tail=80 api web || true

          now=$(git rev-parse HEAD)
          if [ "$prev" != "$now" ] || { [ -n "$prev_api_img" ] && [ "$prev_api_img" != "$new_api_img" ]; }; then
            echo "::warning::Rollback VPS về commit ${prev:0:7}"
            [ "$prev" = "$now" ] || git reset --hard "$prev"
            if [ -n "$prev_api_img" ] && [ -n "$prev_web_img" ]; then
              need_pull=false
              if ! docker image inspect "$prev_api_img" >/dev/null 2>&1 || ! docker image inspect "$prev_web_img" >/dev/null 2>&1; then
                need_pull=true
              fi
              if deploy_images "$prev_api_img" "$prev_web_img" "$need_pull"; then
                echo "Đã rollback về ${prev:0:7} (${prev_api_img}, ${prev_web_img}) và dịch vụ khỏe lại"
              else
                echo "::error::Rollback xong nhưng dịch vụ vẫn không khỏe, cần vào VPS kiểm tra"
              fi
            else
              echo "::error::Không xác định được image cũ trước deploy để rollback tự động, cần vào VPS kiểm tra"
            fi
          fi
          exit 1
          REMOTE

      # Deploy lỗi: đưa phần cuối log từ VPS lên trang tóm tắt của job để xem nhanh nguyên nhân.
      - name: Summarize VPS error
        if: failure() && steps.cfg.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo "### Deploy VPS lỗi (commit \`${COMMIT:0:7}\`)"
            if [ -s "$RUNNER_TEMP/deploy.log" ]; then
              echo '```'; tail -n 60 "$RUNNER_TEMP/deploy.log"; echo '```'
            else
              echo "Không nhận được log từ VPS. Kiểm tra kết nối SSH, VPS_HOST_KEY và VPS_SSH_KEY."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Tùy chọn: đặt Variable VPS_HEALTH_URL (vd https://ten-mien.example/api/v1/health) để kiểm tra từ bên ngoài.
      - name: Check public URL
        if: steps.cfg.outputs.ready == 'true' && vars.VPS_HEALTH_URL != ''
        env:
          VPS_HEALTH_URL: ${{ vars.VPS_HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "$VPS_HEALTH_URL" | jq -e '.status == "UP"' >/dev/null; then
              echo "VPS khỏe: $VPS_HEALTH_URL"; exit 0
            fi
            echo "Lần $i/12 chưa ổn, thử lại sau 5 giây"; sleep 5
          done
          echo "::error::VPS không phản hồi $VPS_HEALTH_URL"; exit 1

      - name: Remove SSH key
        if: always() && steps.cfg.outputs.ready == 'true'
        run: rm -f ~/.ssh/deploy_key
