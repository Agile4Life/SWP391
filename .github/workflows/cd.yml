name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deployment that has already started on either platform.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  release:
    name: Check tested production commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      current: ${{ steps.commit.outputs.current }}
    steps:
      # A slower, older CI run must not roll production back after a newer push.
      - name: Skip commits superseded on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$TESTED_SHA" = "$latest_sha" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping deployment: main has a newer commit.' >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Deploy frontend to Vercel
    needs: release
    if: needs.release.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID secret}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_PROJECT_ID secret}"
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Set VERCEL_CLI_VERSION to an exact reviewed version (x.y.z).'; exit 1; }
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          raw_token = os.environ["VERCEL_TOKEN"]
          raw_org = os.environ["VERCEL_ORG_ID"]
          raw_proj = os.environ["VERCEL_PROJECT_ID"]
          token = raw_token.strip()
          org_id = raw_org.strip()
          proj_id = raw_proj.strip()

          def short(val):
              if not val:
                  return "<empty>"
              if len(val) <= 10:
                  return f"len={len(val)}, prefix={val[:2]!r}"
              return f"{val[:8]}...{val[-4:]} (len={len(val)})"

          def scrub(text):
              s = str(text)
              for full, masked in ((raw_org, short(org_id)), (org_id, short(org_id)), (raw_proj, short(proj_id)), (proj_id, short(proj_id)), (raw_token, "<TOKEN>"), (token, "<TOKEN>")):
                  if full:
                      s = s.replace(full, masked)
              return s

          print(f"Configured VERCEL_ORG_ID:     {short(org_id)} (extra_whitespace={len(raw_org) - len(org_id)})")
          print(f"Configured VERCEL_PROJECT_ID: {short(proj_id)} (extra_whitespace={len(raw_proj) - len(proj_id)})")
          print(f"Configured VERCEL_TOKEN:      len={len(token)} (extra_whitespace={len(raw_token) - len(token)})")

          def api(path):
              req = urllib.request.Request(
                  f"https://api.vercel.com{path}",
                  headers={"Authorization": f"Bearer {token}", "User-Agent": "scms-cd-check"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      body = json.loads(e.read().decode())
                  except Exception:
                      body = {}
                  return e.code, body

          status, user_body = api("/v2/user")
          if status == 200:
              u = user_body.get("user", {})
              print(f"Vercel /v2/user -> 200 OK: username={u.get('username')!r}, id={short(u.get('id') or '')}, defaultTeamId={short(u.get('defaultTeamId') or '')}")
          else:
              print(f"Vercel /v2/user -> HTTP {status}: {scrub(user_body.get('error'))}")

          status, teams_body = api("/v2/teams")
          if status == 200:
              teams = teams_body.get("teams", [])
              print(f"Vercel /v2/teams -> 200 OK ({len(teams)} teams accessible):")
              for t in teams:
                  tid = t.get("id", "")
                  slug = t.get("slug", "")
                  print(f"  - Team slug={slug!r}, id={short(tid)}, matches_ORG_ID={tid == org_id}")
                  p_status, p_body = api(f"/v9/projects?teamId={tid}")
                  if p_status == 200:
                      for p in p_body.get("projects", []):
                          pid = p.get("id", "")
                          pname = p.get("name", "")
                          print(f"      * Project name={pname!r}, id={short(pid)}, matches_PROJECT_ID={pid == proj_id or pname == proj_id}")
                  else:
                      print(f"      * /v9/projects?teamId=... -> HTTP {p_status}: {scrub(p_body.get('error'))}")
          else:
              print(f"Vercel /v2/teams -> HTTP {status}: {scrub(teams_body.get('error'))}")

          p_status, p_body = api("/v9/projects")
          if p_status == 200:
              projs = p_body.get("projects", [])
              print(f"Vercel /v9/projects (no teamId) -> 200 OK ({len(projs)} projects):")
              for p in projs:
                  pid = p.get("id", "")
                  pname = p.get("name", "")
                  acct = p.get("accountId", "")
                  print(f"  * Project name={pname!r}, id={short(pid)}, accountId={short(acct)}, matches_PROJECT_ID={pid == proj_id or pname == proj_id}")

          q = f"?teamId={org_id}" if org_id.startswith("team_") else ""
          status, proj_body = api(f"/v9/projects/{proj_id}{q}")
          print(f"Exact vercel pull check -> HTTP {status}")
          if status != 200:
              err = proj_body.get("error", {})
              print(f"Vercel API error code={err.get('code')!r}, message={scrub(err.get('message'))!r}")
              sys.exit(1)
          PY
      - name: Install pinned Vercel CLI
        env:
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      # Run from the repository root: the linked Vercel project has Root Directory apps/web.
      - name: Pull production settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production frontend
        run: vercel build --prod
      - name: Deploy production frontend
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  backend:
    name: Deploy backend to Render
    needs: release
    if: needs.release.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy tested commit and wait until live
        run: python scripts/deploy-render.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
