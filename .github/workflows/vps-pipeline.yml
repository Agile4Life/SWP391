# Pipeline VPS (Docker Compose tự host) trong MỘT workflow: CI và CD hiện cùng một màn hình, một đồ thị job.
#
#   push vào main ──► Build api ┐
#                     Build web ├──► Deploy VPS (SSH) ──► rollback tự động nếu bản mới không khỏe
#                     CI tests  ┘     (đợi workflow "CI" của đúng commit này xanh)
#
# - PR và nhánh develop: chỉ chạy hai job build image (kiểm tra Docker), không deploy.
# - main: deploy chỉ chạy khi cả build image lẫn CI tests đều xanh; SSH vào VPS, `git merge --ff-only`,
#   `docker compose up -d --build --wait`, health check, lỗi thì quay về commit cũ (job vẫn đỏ để nhóm biết).
# - Bấm "Run workflow" (workflow_dispatch) để deploy lại commit mới nhất của main hoặc một commit chỉ định.
# - Chưa có secret VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_HOST_KEY thì bước deploy tự bỏ qua (không báo lỗi).
# - Tên job build giữ nguyên ("Build and check <api|web> image") để các Ruleset đang yêu cầu check này vẫn đúng.
# Hướng dẫn cài đặt: docs/DOCKER_COMPOSE.md, mục "Tự động deploy lên VPS (CD qua SSH)".
# Workflow "CI" (ci.yml) và "CD" (cd.yml, Render/Vercel) vẫn chạy riêng như cũ.
name: VPS CI/CD ssh tunnel workflow

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA cần deploy (để trống = đầu nhánh main)
        required: false
        default: ''

permissions:
  contents: read
  actions: read          # job "CI tests" đọc trạng thái workflow CI của cùng commit

# PR mới huỷ lần chạy cũ của PR đó; push/chạy tay trên main không bị huỷ giữa chừng (tránh cắt ngang lúc deploy).
concurrency:
  group: vps-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Build and check ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose with dummy settings
        if: matrix.service == 'api'
        run: |
          set -euo pipefail
          compose_dir=$(mktemp -d)
          trap 'rm -rf -- "$compose_dir"' EXIT
          printf 'SPRING_DATASOURCE_URL=jdbc:postgresql://example.invalid:5432/postgres\nSPRING_DATASOURCE_USERNAME=test\nSPRING_DATASOURCE_PASSWORD=test-only\nAPP_JWT_SECRET=test-only\n' > "$compose_dir/.env"
          docker compose --project-directory "$compose_dir" \
            -f "$GITHUB_WORKSPACE/compose.yml" config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: scms-${{ matrix.service }}:ci
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Check Java runtime and healthcheck tool
        if: matrix.service == 'api'
        run: docker run --rm --entrypoint sh scms-api:ci -c 'java -version && command -v wget'
      - name: Check Nginx config and React routes
        if: matrix.service == 'web'
        run: |
          set -euo pipefail
          docker run --rm scms-web:ci nginx -t
          docker run -d --name scms-web-check scms-web:ci
          trap 'docker rm -f scms-web-check >/dev/null' EXIT
          for _ in $(seq 1 15); do
            if docker exec scms-web-check wget -q -O /dev/null http://127.0.0.1/index.html; then
              docker exec scms-web-check wget -qO- http://127.0.0.1/login | grep -q 'id="root"'
              exit 0
            fi
            sleep 1
          done
          docker logs scms-web-check
          exit 1

  ci-tests:
    name: CI tests (same commit)
    # Chỉ cần khi sắp deploy: đợi workflow "CI" (test frontend + backend) của đúng commit này kết thúc.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ inputs.ref || github.sha }}
    steps:
      - name: Wait for the CI workflow of this commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Đợi workflow CI của commit ${COMMIT:0:7}..."
          missing=0
          for _ in $(seq 1 180); do
            row=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status // "none") \(.conclusion // "none") \(.html_url // "")"' 2>/dev/null || echo "none none ")
            status=$(cut -d' ' -f1 <<<"$row"); conclusion=$(cut -d' ' -f2 <<<"$row"); url=$(cut -d' ' -f3 <<<"$row")
            if [ "$status" = "completed" ]; then
              {
                echo "### CI tests của commit \`${COMMIT:0:7}\`: **$conclusion**"
                [ -n "$url" ] && echo "[Mở lần chạy CI]($url)"
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$conclusion" = "success" ]; then echo "CI xanh."; exit 0; fi
              echo "::error::CI kết thúc với kết quả '$conclusion', không deploy. $url"
              exit 1
            fi
            if [ "$status" = "none" ]; then
              missing=$((missing + 1))
              if [ "$missing" -ge 12 ]; then
                echo "::error::Không thấy lần chạy CI nào cho commit ${COMMIT:0:7} sau 2 phút. Chạy CI trước rồi bấm Run workflow."
                exit 1
              fi
            else
              missing=0
            fi
            sleep 10
          done
          echo "::error::Hết thời gian đợi CI (30 phút)."
          exit 1

  deploy:
    name: Deploy to VPS over SSH
    needs: [images, ci-tests]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Chỉ một lần deploy lên VPS tại một thời điểm; lần mới đợi lần đang chạy xong.
    concurrency:
      group: vps-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      # Thư mục repo trên VPS (nơi có compose.yml và .env). Đổi bằng Variable VPS_APP_DIR.
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/scms' }}
      # Commit cần deploy: commit vừa qua CI, hoặc commit nhập tay.
      COMMIT: ${{ inputs.ref || github.sha }}
    steps:
      - name: Check VPS secrets
        id: cfg
        shell: bash
        run: |
          missing=""
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Chưa cấu hình secret:$missing. Bỏ qua deploy VPS."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.cfg.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          # Ghim host key của VPS (từ secret) để tránh bị giả mạo máy chủ; không dùng StrictHostKeyChecking=no.
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy on VPS (with rollback)
        if: steps.cfg.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Script chạy trên VPS qua stdin; tham số: $1 = commit, $2 = thư mục app.
          # tee giữ lại toàn bộ log trong deploy.log để bước tóm tắt bên dưới dùng khi lỗi.
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" bash -s -- "$COMMIT" "$VPS_APP_DIR" 2>&1 <<'REMOTE' | tee "$RUNNER_TEMP/deploy.log"
          set -euo pipefail
          commit=$1
          dir=$2
          # Lệnh nào lỗi bất ngờ thì báo rõ dòng và lệnh đó (thông báo gốc của lệnh nằm ngay phía trên).
          trap 'echo "::error::Lệnh bị lỗi (dòng $LINENO): $BASH_COMMAND"' ERR

          # Kiểm tra môi trường trước, lỗi thì nói rõ cách sửa thay vì để git/docker báo lỗi khó hiểu.
          preflight_fail() { echo "::error::$1"; echo "Cách sửa: $2"; exit 1; }
          [ -d "$dir/.git" ] || preflight_fail "Không thấy repo git tại $dir trên VPS" "clone repo vào đó hoặc đặt Variable VPS_APP_DIR đúng đường dẫn"
          cd "$dir"
          [ -f compose.yml ] || preflight_fail "Không có compose.yml trong $dir" "kiểm tra lại VPS_APP_DIR"
          [ -f .env ] || preflight_fail "Thiếu file .env trong $dir" "tạo từ compose.env.example theo docs/DOCKER_COMPOSE.md"
          [ -w .git/objects ] || preflight_fail "User $(id -un) không có quyền ghi vào $dir/.git (owner: $(stat -c %U .git))" "sudo chown -R $(id -un):$(id -gn) $dir"
          docker info >/dev/null 2>&1 || preflight_fail "User $(id -un) không dùng được docker" "sudo usermod -aG docker $(id -un) rồi đăng nhập lại"
          docker compose version >/dev/null 2>&1 || preflight_fail "Chưa cài plugin Docker Compose v2" "cài docker-compose-plugin"
          echo "Còn trống $(df -h --output=avail "$dir" | tail -1 | tr -d ' ') ổ đĩa tại $dir"

          # Không ghi đè thay đổi tay trên VPS: có file đã theo dõi bị sửa thì dừng để người quản trị xử lý.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Repo trên VPS có thay đổi chưa commit, dừng deploy"
            git status --short --untracked-files=no
            exit 1
          fi

          prev=$(git rev-parse HEAD)
          echo "Commit đang chạy: ${prev:0:7}; commit cần deploy: ${commit:0:7}"
          git fetch --prune origin
          # Chỉ tiến lên (fast-forward). Nếu commit cũ hơn HEAD thì không làm gì, tránh deploy lùi khi hai lần chạy chồng nhau.
          git merge --ff-only "$commit"

          # Build image, thay container và đợi healthcheck của api + web (tối đa 5 phút),
          # rồi gọi thử API qua Nginx để chắc proxy /api/v1 hoạt động.
          # Không dùng `docker compose down`: nó xóa mạng và làm mất kết nối tới container PostgreSQL 1Panel.
          deploy() {
            docker compose config --quiet &&
            docker compose up -d --build --remove-orphans --wait --wait-timeout 300 &&
            docker compose exec -T web wget -q -O /dev/null http://127.0.0.1/api/v1/health
          }

          if deploy; then
            docker compose ps
            # Dọn image cũ không còn dùng cho đỡ đầy ổ đĩa.
            docker image prune -f >/dev/null || true
            echo "Deploy thành công commit $(git rev-parse --short HEAD)"
            exit 0
          fi

          echo "::error::Bản mới không khỏe (build lỗi hoặc container không qua healthcheck). Trạng thái và log gần nhất:"
          docker compose ps -a || true
          docker compose logs --tail=80 api web || true

          now=$(git rev-parse HEAD)
          if [ "$prev" != "$now" ]; then
            echo "::warning::Rollback VPS về commit ${prev:0:7}"
            git reset --hard "$prev"
            if deploy; then
              echo "Đã rollback về ${prev:0:7} và dịch vụ khỏe lại"
            else
              echo "::error::Rollback xong nhưng dịch vụ vẫn không khỏe, cần vào VPS kiểm tra"
            fi
          fi
          exit 1
          REMOTE

      # Deploy lỗi: đưa phần cuối log từ VPS lên trang tóm tắt của job để xem nhanh nguyên nhân.
      - name: Summarize VPS error
        if: failure() && steps.cfg.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo "### Deploy VPS lỗi (commit \`${COMMIT:0:7}\`)"
            if [ -s "$RUNNER_TEMP/deploy.log" ]; then
              echo '```'; tail -n 60 "$RUNNER_TEMP/deploy.log"; echo '```'
            else
              echo "Không nhận được log từ VPS. Kiểm tra kết nối SSH, VPS_HOST_KEY và VPS_SSH_KEY."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Tùy chọn: đặt Variable VPS_HEALTH_URL (vd https://ten-mien.example/api/v1/health) để kiểm tra từ bên ngoài.
      - name: Check public URL
        if: steps.cfg.outputs.ready == 'true' && vars.VPS_HEALTH_URL != ''
        env:
          VPS_HEALTH_URL: ${{ vars.VPS_HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "$VPS_HEALTH_URL" | jq -e '.status == "UP"' >/dev/null; then
              echo "VPS khỏe: $VPS_HEALTH_URL"; exit 0
            fi
            echo "Lần $i/12 chưa ổn, thử lại sau 5 giây"; sleep 5
          done
          echo "::error::VPS không phản hồi $VPS_HEALTH_URL"; exit 1

      - name: Remove SSH key
        if: always() && steps.cfg.outputs.ready == 'true'
        run: rm -f ~/.ssh/deploy_key
